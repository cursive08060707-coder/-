<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>连板多日对比</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #fff;
      --line: #e5eaf2;
      --line-strong: #cfd9e8;
      --text: #253247;
      --muted: #7b8799;
      --accent: #3b6fe8;
      --up: #d95c45;
      --accent-soft: #edf3ff;
      --label-width: 112px;
      --cell-width: 290px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif; }
    body { padding: 22px; }
    .page { max-width: 2100px; margin: 0 auto; }
    .control-panel { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-bottom: 10px; padding: 8px 10px; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; box-shadow: 0 5px 18px rgba(45,68,104,.05); scrollbar-width: thin; }
    .topbar { display: flex; flex: 0 0 auto; align-items: center; gap: 10px; margin: 0; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .02em; line-height: 34px; white-space: nowrap; }
    .subtitle { display: none; }
    .status { max-width: 150px; overflow: hidden; color: var(--muted); font-size: 11px; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .toolbar { display: flex; flex: 1 0 auto; align-items: center; flex-wrap: nowrap; gap: 7px; padding: 0; background: transparent; border: 0; border-radius: 0; box-shadow: none; }
    .toolbar label { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .toolbar input#search { width: 170px; }
    .toolbar input#dateSearch { width: 125px; }
    input, select, button { height: 34px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--text); font: inherit; font-size: 13px; }
    input { width: 195px; padding: 0 10px; }
    select, button { padding: 0 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    button.primary:hover { color: #fff; background: #2d5ed0; }
    .legend { display: none; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { display: inline-block; width: 17px; height: 11px; border-radius: 3px; }
    .legend .board-mark { background: #f0f4fb; border: 1px solid #d4deed; }
    .legend .stock-mark { background: var(--accent-soft); border: 1px solid #bdd0f7; }
    .legend .empty-mark { background: #fafbfe; border: 1px dashed #dce3ef; }
    .hint { flex: 0 1 210px; min-width: 0; margin: 0; overflow: hidden; color: var(--muted); font-size: 11px; line-height: 16px; text-overflow: ellipsis; white-space: nowrap; }
    .zoom-step { width: 30px; padding: 0; font-size: 17px; line-height: 30px; }
    #zoomSelect { width: 72px; padding: 0 5px; text-align: center; }
    .viewport { position: relative; height: calc(100vh - 105px); min-height: 500px; overflow: auto; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); box-shadow: 0 8px 28px rgba(45,68,104,.07); overscroll-behavior: contain; scrollbar-color: #bdc8d9 #f3f6fa; }
    .viewport.is-scrolling .stock-chip { pointer-events: none; transition: none; }
    .matrix { min-width: calc(var(--label-width) + var(--cell-width)); }
    .matrix-header, .board-row { display: grid; width: max-content; }
    .board-row { grid-template-columns: var(--date-template); }
    .matrix-header { position: sticky; top: 0; z-index: 10; height: 59px; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line-strong); }
    .corner, .board-label { position: sticky; left: 0; z-index: 4; background: #fff; }
    .corner { display: flex; align-items: center; padding: 0 12px; border-right: 1px solid var(--line-strong); color: var(--muted); font-size: 12px; }
    .date-head { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; border-right: 1px solid var(--line); color: var(--text); font-size: 12px; }
    .date-head small { color: var(--muted); font-size: 10px; }
    .virtual-spacer { min-width: 0; pointer-events: none; background: #fff; }
    .matrix-header > .virtual-spacer { background: rgba(255,255,255,.97); }
    .board-row { border-bottom: 1px solid var(--line-strong); }
    .board-label { display: flex; align-items: flex-start; justify-content: center; padding-top: 18px; border-right: 1px solid var(--line-strong); color: #58729a; font-size: 15px; font-weight: 700; }
    .board-label.high { color: var(--up); }
    .board-cell { min-height: 106px; overflow: hidden; padding: 10px 11px 12px; border-right: 1px solid var(--line); background: #fff; vertical-align: top; }
    .board-cell.has-content { background: linear-gradient(180deg,#fff 0%,#fcfdff 100%); }
    .board-cell.cell-match { background: #fffaf0; box-shadow: inset 0 0 0 2px #f0c36b; }
    .board-cell.selected-cell { background: #fff8e8; box-shadow: inset 0 0 0 2px #e4a62e; }
    .board-cell.cell-dim .stock-chip { opacity: .36; }
    .cell-empty { display: flex; align-items: flex-start; justify-content: center; min-height: 80px; padding-top: 23px; color: #d6deea; font-size: 18px; }
    .content-line { margin: 0 0 7px; line-height: 1.7; font-size: 12px; }
    .theme-line { margin: 1px 0 4px; color: #5d79a1; font-size: 11px; font-weight: 700; }
    .stock-chip { display: inline-flex; align-items: baseline; gap: 4px; margin: 0 4px 4px 0; padding: 3px 6px; border: 1px solid #d6e1f4; border-radius: 5px; background: #f7faff; color: #344f79; cursor: pointer; line-height: 1.2; white-space: nowrap; transition: .15s ease; }
    .stock-chip.bid-seal { border-color: #fecdd3; background: #fff1f2; color: #9f1239; }
    .stock-chip.three-board-pool { border-color: #60a5fa; background: #eff6ff; color: #1d4ed8; font-weight: 700; box-shadow: 0 0 0 1px rgba(37,99,235,.10); }
    .stock-chip.bid-seal.three-board-pool { background: linear-gradient(90deg,#fff1f2 0 6px,#eff6ff 6px); }
    .stock-chip:hover, .stock-chip.match { border-color: #8eafea; background: var(--accent-soft); color: #2458bd; }
    .stock-chip.selected { border-color: #dc9824; background: #ffe4a3; color: #7b4c00; box-shadow: 0 0 0 2px rgba(220,152,36,.18); font-weight: 700; opacity: 1 !important; }
    .stock-chip.selected em { color: #9b6b1a; }
    .stock-grid { display: flex; align-items: flex-start; gap: 10px; width: max-content; }
    .stock-group { display: grid; grid-template-columns: repeat(3, max-content); grid-auto-rows: min-content; align-content: start; gap: 4px 6px; }
    .stock-grid .stock-chip { margin: 0; }
    .stock-chip em { color: #8b9bb3; font: 9px ui-monospace,SFMono-Regular,Menlo,monospace; font-style: normal; }
    .stock-chip .auction-pct { margin-left: 2px; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .auction-pct.positive { color: #d95c45; }
    .auction-pct.negative { color: #2b9c73; }
    .auction-pct.flat { color: #8b9bb3; }
    .no-data { padding: 50px; color: var(--muted); text-align: center; font-size: 13px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(31,43,61,.24); backdrop-filter: blur(3px); }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(650px,100%); max-height: min(720px,90vh); overflow: auto; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 20px 70px rgba(31,43,61,.2); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 15px; }
    .modal h2 { margin: 0 0 5px; font-size: 20px; }
    .modal .code { color: var(--muted); font: 12px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .close { width: 30px; height: 30px; padding: 0; border-radius: 50%; font-size: 20px; line-height: 25px; }
    .history { display: grid; grid-template-columns: repeat(auto-fill,minmax(125px,1fr)); gap: 8px; }
    .history-item { padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcff; }
    .history-item time { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; }
    .history-item strong { font-size: 14px; }
    .history-item.recent { border-color: #b9d4fb; background: #f2f7ff; }
    .search-history-modal { width: min(560px,100%); }
    .search-stock-list { display: grid; grid-template-columns: repeat(auto-fill,minmax(170px,1fr)); gap: 8px; }
    .search-stock-choice, .history-jump { height: auto; min-height: 48px; padding: 8px 10px; text-align: left; }
    .search-stock-choice { display: flex; align-items: center; justify-content: space-between; gap: 9px; background: #fbfcff; }
    .search-stock-choice strong { font-size: 13px; }
    .search-stock-choice span { color: var(--muted); font: 10px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .search-stock-choice small { color: #58729a; font-size: 10px; white-space: nowrap; }
    .search-history-list { display: grid; grid-template-columns: repeat(auto-fill,minmax(135px,1fr)); gap: 8px; }
    .history-jump { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-color: #d7e2f4; background: #f8faff; }
    .history-jump:hover { border-color: #8eafea; background: var(--accent-soft); }
    .history-jump time { color: #506887; font-size: 11px; }
    .history-jump strong { color: var(--up); font-size: 13px; }
    .search-empty { padding: 25px 8px; color: var(--muted); text-align: center; font-size: 12px; }
    .detail-summary { display: grid; grid-template-columns: repeat(auto-fit,minmax(145px,1fr)); gap: 7px; margin-bottom: 14px; }
    .summary-item { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcff; }
    .summary-item small { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; }
    .summary-item strong { font-size: 13px; font-weight: 650; }
    .detail-section { margin-top: 14px; }
    .detail-section h3 { margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 13px; }
    .concept-pills { display: flex; flex-wrap: wrap; gap: 5px; }
    .concept-pill { padding: 3px 7px; border: 1px solid #d7e2f4; border-radius: 5px; background: #f7faff; color: #49658e; font-size: 11px; }
    .concept-explanation { margin-top: 8px; padding: 8px 10px; border-left: 3px solid #c8d7f2; background: #fafcff; color: #59677c; font-size: 12px; line-height: 1.65; }
    .concept-explanation strong { color: #3c5780; }
    .share-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(145px,1fr)); gap: 7px; }
    .top10-list { margin-top: 9px; border-top: 1px solid var(--line); }
    .top10-item { display: grid; grid-template-columns: minmax(0,1fr) 54px auto; gap: 7px; padding: 6px 0; border-bottom: 1px solid #f0f2f6; font-size: 11px; }
    .top10-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top10-ratio { color: #49658e; text-align: right; }
    .top10-change { color: var(--muted); text-align: right; }
    .shareholder-columns { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; margin-top: 9px; }
    .shareholder-column { min-width: 0; }
    .shareholder-column h4 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0; padding: 7px 0; color: #58729a; font-size: 12px; }
    .shareholder-total { color: var(--muted); font-size: 10px; font-weight: 400; white-space: nowrap; }
    .shareholder-column .top10-list { margin-top: 0; }
    .empty-detail { color: var(--muted); font-size: 12px; }
    @media (max-width: 1200px) {
      .control-panel { flex-wrap: wrap; align-items: center; }
      .toolbar { flex-basis: 100%; overflow-x: auto; padding-bottom: 2px; }
      .hint { flex-basis: 100%; }
      .viewport { height: calc(100vh - 155px); }
    }
    @media (max-width: 720px) {
      .shareholder-columns { grid-template-columns: 1fr; }
      body { padding: 12px; }
      .control-panel { align-items: flex-start; gap: 6px 10px; }
      .topbar { align-items: center; flex-direction: row; gap: 8px; }
      .status { text-align: left; }
      .toolbar { flex-wrap: wrap; row-gap: 6px; }
      .hint { flex-basis: 100%; }
      .viewport { height: calc(100vh - 175px); min-height: 430px; }
      input { width: 160px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="control-panel">
      <header class="topbar">
        <div>
          <h1>连板多日对比</h1>
          <div class="subtitle">纵轴：连板层级　·　横轴：交易日期（近 → 远）　·　按钮显示当日 9:25 竞价涨幅　·　单击高亮，双击查看历史涨停和股票详情</div>
        </div>
        <div class="status" id="status">正在读取涨停数据…</div>
      </header>
      <section class="toolbar">
        <label for="search">搜索股票</label>
        <input id="search" type="search" placeholder="名称或代码，回车查看日期">
        <button id="searchBtn">查看日期</button>
        <label for="dateSearch">按日期</label>
        <input id="dateSearch" type="search" placeholder="如 2026-08-07" aria-label="按日期定位">
        <button id="dateSearchBtn">定位日期</button>
        <label for="initialDays">渲染窗口</label>
        <select id="initialDays">
          <option value="18">18天</option>
          <option value="30" selected>30天</option>
          <option value="42">42天</option>
          <option value="60">60天</option>
        </select>
        <label for="zoomSelect">整体缩放</label>
        <button class="zoom-step" id="zoomOut" type="button" title="缩小显示">−</button>
        <select id="zoomSelect" aria-label="整体缩放比例">
          <option value="0.6">60%</option>
          <option value="0.7">70%</option>
          <option value="0.8">80%</option>
          <option value="0.9">90%</option>
          <option value="1" selected>100%</option>
          <option value="1.1">110%</option>
          <option value="1.2">120%</option>
          <option value="1.25">125%</option>
          <option value="1.3">130%</option>
          <option value="1.4">140%</option>
          <option value="1.5">150%</option>
        </select>
        <button class="zoom-step" id="zoomIn" type="button" title="放大显示">＋</button>
        <button class="primary" id="todayBtn">回到最近</button>
        <button id="clearSelection">取消股票高亮</button>
        <button id="reloadBtn">重新读取</button>
      </section>
      <div class="hint" id="hint">单击股票按钮同步高亮全部历史位置，双击打开详情；横向滚动可连续浏览全部日期；可用整体缩放或 Cmd/Ctrl +/- 调整显示。</div>
    </div>
    <section class="viewport" id="viewport" aria-label="连板多日对比矩阵">
      <div class="matrix" id="matrix">
        <div class="matrix-header" id="matrixHeader"></div>
        <div id="matrixBody"></div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div><h2 id="modalTitle">股票连板历史</h2><div class="code" id="modalCode"></div></div>
        <button class="close" id="modalClose" aria-label="关闭">×</button>
      </div>
      <div class="detail-summary" id="detailSummary"></div>
      <section class="detail-section"><h3>题材概念</h3><div id="detailConcepts"></div></section>
      <section class="detail-section"><h3>股东与股本信息</h3><div id="detailShareholders"></div></section>
      <section class="detail-section"><h3>历史涨停</h3></section>
      <div class="history" id="history"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="searchHistoryBackdrop">
    <div class="modal search-history-modal" role="dialog" aria-modal="true" aria-labelledby="searchHistoryTitle">
      <div class="modal-head">
        <div><h2 id="searchHistoryTitle">选择股票</h2><div class="code" id="searchHistorySubtitle"></div></div>
        <button class="close" id="searchHistoryClose" aria-label="关闭">×</button>
      </div>
      <div id="searchHistoryBody"></div>
    </div>
  </div>

  <script src="zt_data.js"></script>
  <script src="bid_seal_data.js"></script>
  <script src="three_board_pool.js?v=20260818-2"></script>
  <script src="zt_auction_change_data.js"></script>
  <script>
    (() => {
      'use strict';
      const LABEL_WIDTH = 112, CELL_WIDTH = 290, WINDOW_OVERSCAN = 5, SCROLL_IDLE_MS = 90;
      const BOARD_TEXT = { '首板': 1, '一板': 1, '二板': 2, '三板': 3, '四板': 4, '五板': 5, '六板': 6, '七板': 7, '八板': 8, '九板': 9, '十板': 10 };
      const AUCTION_DATA = window.ZT_AUCTION_CHANGE_DATA || { dates: {} };
      const BID_DATA = typeof BID !== 'undefined' && BID ? BID : {};
      const BID_CODES_BY_DATE = new Map(Object.entries(BID_DATA).map(([date, rows]) => [
        date,
        new Set((Array.isArray(rows) ? rows : []).map(item => String(item && item.c || '').trim()).filter(Boolean))
      ]));
      const THREE_BOARD_POOL_DATA = window.THREE_BOARD_POOL_DATA || { stocks: [] };
      const THREE_BOARD_POOL_CODES = new Set((Array.isArray(THREE_BOARD_POOL_DATA.stocks) ? THREE_BOARD_POOL_DATA.stocks : []).map(item => String(item && item.c || '').trim()).filter(Boolean));
      const els = {
        viewport: document.getElementById('viewport'), matrix: document.getElementById('matrix'), header: document.getElementById('matrixHeader'), body: document.getElementById('matrixBody'),
        status: document.getElementById('status'), hint: document.getElementById('hint'), search: document.getElementById('search'), searchBtn: document.getElementById('searchBtn'), dateSearch: document.getElementById('dateSearch'), dateSearchBtn: document.getElementById('dateSearchBtn'), initialDays: document.getElementById('initialDays'), zoomOut: document.getElementById('zoomOut'), zoomSelect: document.getElementById('zoomSelect'), zoomIn: document.getElementById('zoomIn'), todayBtn: document.getElementById('todayBtn'), clearSelection: document.getElementById('clearSelection'), reloadBtn: document.getElementById('reloadBtn'),
        modal: document.getElementById('modalBackdrop'), modalTitle: document.getElementById('modalTitle'), modalCode: document.getElementById('modalCode'), detailSummary: document.getElementById('detailSummary'), detailConcepts: document.getElementById('detailConcepts'), detailShareholders: document.getElementById('detailShareholders'), history: document.getElementById('history'), modalClose: document.getElementById('modalClose'),
        searchHistoryModal: document.getElementById('searchHistoryBackdrop'), searchHistoryTitle: document.getElementById('searchHistoryTitle'), searchHistorySubtitle: document.getElementById('searchHistorySubtitle'), searchHistoryBody: document.getElementById('searchHistoryBody'), searchHistoryClose: document.getElementById('searchHistoryClose')
      };
      const state = {
        records: [], dates: [], recordByDate: new Map(), dateIndex: new Map(), stockHistory: new Map(),
        maxBoard: 1, windowSize: 30, windowStart: 0, windowEnd: 0,
        columnWidths: [], columnOffsets: [0], totalDateWidth: 0,
        query: '', selectedCode: '', scrollTimer: 0, searchTimer: 0, zoom: 1
      };
      let detailDataPromise = null;

      function clampZoom(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return 1;
        return Math.max(0.6, Math.min(1.5, Math.round(number * 100) / 100));
      }
      function readStoredZoom() {
        try { return clampZoom(localStorage.getItem('zt-multi-day-zoom') || 1); } catch (_) { return 1; }
      }
      function applyZoom(value, preservePosition = true, refresh = true) {
        const next = clampZoom(value);
        const previous = state.zoom || 1;
        const logicalLeft = preservePosition ? els.viewport.scrollLeft / previous : 0;
        state.zoom = next;
        els.matrix.style.zoom = String(next);
        els.zoomSelect.value = String(next);
        els.viewport.scrollLeft = Math.max(0, logicalLeft * next);
        try { localStorage.setItem('zt-multi-day-zoom', String(next)); } catch (_) {}
        if (refresh) syncVirtualWindow(true);
        updateStatus();
      }

      function boardNumber(value) {
        const text = String(value || '').trim();
        return BOARD_TEXT[text] || 0;
      }
      function parseRecord(item) {
        const sections = new Map();
        const stockCounts = new Map();
        let board = 0;
        for (const raw of String(item.t || '').split(/\r?\n/)) {
          const line = raw.trim();
          const next = boardNumber(line);
          if (next) { board = next; sections.set(board, []); stockCounts.set(board, 0); continue; }
          if (board && line) {
            sections.get(board).push(line);
            stockCounts.set(board, stockCounts.get(board) + [...line.matchAll(/([^，,、；;\s]+?)（[^）]*）(\d{6})/g)].length);
          }
        }
        return { date: item.d, sections, stockCounts };
      }
      function buildStockHistory() {
        state.stockHistory = new Map();
        for (const record of state.records) {
          for (const [board, lines] of record.sections) {
            for (const line of lines) {
              for (const match of line.matchAll(/([^，,、；;\s]+?)（[^）]*）(\d{6})/g)) {
                const name = match[1], code = match[2];
                if (!state.stockHistory.has(code)) state.stockHistory.set(code, { name, code, days: [] });
                state.stockHistory.get(code).days.push({ date: record.date, board });
              }
            }
          }
        }
      }
      function loadData() {
        const list = (typeof P !== 'undefined' && Array.isArray(P)) ? P : [];
        state.records = list.map(parseRecord).filter(record => record.date).sort((a, b) => b.date.localeCompare(a.date));
        state.dates = state.records.map(record => record.date);
        state.recordByDate = new Map(state.records.map(record => [record.date, record]));
        state.dateIndex = new Map(state.dates.map((date, index) => [date, index]));
        state.maxBoard = Math.max(1, ...state.records.flatMap(record => [...record.sections.keys()]));
        buildStockHistory();
        state.windowSize = Math.max(12, Number(els.initialDays.value) || 30);
        buildLayoutIndex();
        applyZoom(state.zoom, false, false);
        els.viewport.scrollLeft = 0;
        state.windowStart = 0;
        state.windowEnd = Math.min(state.dates.length, state.windowSize);
        renderWindow(true);

      function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

        clearTimeout(state.searchTimer);
        state.searchTimer = setTimeout(() => {
          state.query = els.search.value.trim().toLowerCase();
          renderWindow(true);
          const exact = matchingStocks(state.query).find(stock => stock.code === state.query || stock.name.toLowerCase() === state.query);
          if (exact) showStockDateChoices(exact);
        }, 120);
      });
      els.search.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        clearTimeout(state.searchTimer);
        state.query = els.search.value.trim().toLowerCase();
        renderWindow(true);
        openSearchHistory(els.search.value);
      });
      els.searchBtn.addEventListener('click', () => openSearchHistory(els.search.value));
      els.searchHistoryBody.addEventListener('click', event => {
        const stockButton = event.target.closest('[data-search-code]');
        if (stockButton) {
          showStockDateChoices(state.stockHistory.get(stockButton.dataset.searchCode));
          return;
        }
        const dateButton = event.target.closest('[data-jump-date]');
        if (dateButton) jumpToStockDate(dateButton.dataset.jumpCode, dateButton.dataset.jumpDate);
      });
      els.dateSearchBtn.addEventListener('click', () => jumpToDate(els.dateSearch.value));
      els.dateSearch.addEventListener('keydown', event => { if (event.key === 'Enter') jumpToDate(els.dateSearch.value); });
      els.zoomSelect.addEventListener('change', () => applyZoom(els.zoomSelect.value));
      els.zoomOut.addEventListener('click', () => applyZoom((state.zoom || 1) - 0.1));
      els.zoomIn.addEventListener('click', () => applyZoom((state.zoom || 1) + 0.1));
      els.initialDays.addEventListener('change', () => {
        state.windowSize = Math.max(12, Number(els.initialDays.value) || 30);
        syncVirtualWindow(true);
      });
      els.todayBtn.addEventListener('click', () => { els.viewport.scrollLeft = 0; syncVirtualWindow(true); });
      els.clearSelection.addEventListener('click', () => selectStock(''));
      els.reloadBtn.addEventListener('click', loadData);
      els.modalClose.addEventListener('click', () => els.modal.classList.remove('open'));
      els.modal.addEventListener('click', event => { if (event.target === els.modal) els.modal.classList.remove('open'); });
      els.searchHistoryClose.addEventListener('click', () => els.searchHistoryModal.classList.remove('open'));
      els.searchHistoryModal.addEventListener('click', event => { if (event.target === els.searchHistoryModal) els.searchHistoryModal.classList.remove('open'); });
      document.addEventListener('keydown', event => {
        if ((event.metaKey || event.ctrlKey) && !event.altKey) {
          if (event.key === '+' || event.key === '=') { event.preventDefault(); applyZoom((state.zoom || 1) + 0.1); return; }
          if (event.key === '-') { event.preventDefault(); applyZoom((state.zoom || 1) - 0.1); return; }
          if (event.key === '0') { event.preventDefault(); applyZoom(1); return; }
        }
        if (event.key !== 'Escape') return;
        els.modal.classList.remove('open');
        els.searchHistoryModal.classList.remove('open');
      });
      state.zoom = readStoredZoom();
      loadData();
    })();
  </script>
</body>
</html>
