<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>连板多日对比</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #fff;
      --line: #e5eaf2;
      --line-strong: #cfd9e8;
      --text: #253247;
      --muted: #7b8799;
      --accent: #3b6fe8;
      --up: #d95c45;
      --accent-soft: #edf3ff;
      --label-width: 112px;
      --cell-width: 290px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif; }
    body { padding: 22px; }
    .page { max-width: 2100px; margin: 0 auto; }
    .control-panel { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-bottom: 10px; padding: 8px 10px; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; box-shadow: 0 5px 18px rgba(45,68,104,.05); scrollbar-width: thin; }
    .topbar { display: flex; flex: 0 0 auto; align-items: center; gap: 10px; margin: 0; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .02em; line-height: 34px; white-space: nowrap; }
    .subtitle { display: none; }
    .status { max-width: 150px; overflow: hidden; color: var(--muted); font-size: 11px; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .toolbar { display: flex; flex: 1 0 auto; align-items: center; flex-wrap: nowrap; gap: 7px; padding: 0; background: transparent; border: 0; border-radius: 0; box-shadow: none; }
    .toolbar label { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .toolbar input#search { width: 170px; }
    .toolbar input#dateSearch { width: 125px; }
    input, select, button { height: 34px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--text); font: inherit; font-size: 13px; }
    input { width: 195px; padding: 0 10px; }
    select, button { padding: 0 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    button.primary:hover { color: #fff; background: #2d5ed0; }
    .legend { display: none; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { display: inline-block; width: 17px; height: 11px; border-radius: 3px; }
    .legend .board-mark { background: #f0f4fb; border: 1px solid #d4deed; }
    .legend .stock-mark { background: var(--accent-soft); border: 1px solid #bdd0f7; }
    .legend .empty-mark { background: #fafbfe; border: 1px dashed #dce3ef; }
    .hint { flex: 0 1 210px; min-width: 0; margin: 0; overflow: hidden; color: var(--muted); font-size: 11px; line-height: 16px; text-overflow: ellipsis; white-space: nowrap; }
    .mobile-panel-toggle { display: none; flex: 0 0 auto; height: 30px; padding: 0 9px; border-color: #cfd9e8; color: #49658e; font-size: 11px; white-space: nowrap; }
    .zoom-step { width: 30px; padding: 0; font-size: 17px; line-height: 30px; }
    #zoomSelect { width: 72px; padding: 0 5px; text-align: center; }
    .viewport { position: relative; height: calc(100vh - 105px); min-height: 500px; overflow: auto; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); box-shadow: 0 8px 28px rgba(45,68,104,.07); overscroll-behavior: contain; scrollbar-color: #bdc8d9 #f3f6fa; }
    .viewport.is-scrolling .stock-chip { pointer-events: none; transition: none; }
    .matrix { min-width: calc(var(--label-width) + var(--cell-width)); }
    .matrix-header, .board-row { display: grid; width: max-content; }
    .board-row { grid-template-columns: var(--date-template); }
    .matrix-header { position: sticky; top: 0; z-index: 10; height: 82px; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line-strong); }
    .corner, .board-label { position: sticky; left: 0; z-index: 4; background: #fff; }
    .corner { display: flex; align-items: center; padding: 0 12px; border-right: 1px solid var(--line-strong); color: var(--muted); font-size: 12px; }
    .date-head { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; border-right: 1px solid var(--line); color: var(--text); font-size: 12px; }
    .date-head small { color: var(--muted); font-size: 10px; }
    .date-actions { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 2px; }
    .date-action { height: 22px; padding: 0 7px; border-radius: 5px; border-color: #d7e2f4; color: #49658e; font-size: 10px; line-height: 20px; }
    .date-action:hover { background: var(--accent-soft); }
    .virtual-spacer { min-width: 0; pointer-events: none; background: #fff; }
    .matrix-header > .virtual-spacer { background: rgba(255,255,255,.97); }
    .board-row { border-bottom: 1px solid var(--line-strong); }
    .board-label { display: flex; align-items: flex-start; justify-content: center; padding-top: 18px; border-right: 1px solid var(--line-strong); color: #58729a; font-size: 15px; font-weight: 700; }
    .board-label.high { color: var(--up); }
    .high-board-divider { display: grid; grid-template-columns: var(--date-template); width: max-content; height: 38px; border-top: 2px solid #e5b458; border-bottom: 1px solid #ecd7ad; background: #fffbf2; }
    .high-board-divider-label { position: sticky; left: 0; z-index: 5; display: flex; align-items: center; justify-content: center; border-right: 1px solid #e5c992; background: #fff9e9; }
    .high-board-divider-line { grid-column: 2/-1; display: flex; align-items: center; padding-left: 12px; color: #a27020; font-size: 10px; font-weight: 650; }
    .high-board-toggle { height: 25px; padding: 0 8px; border-color: #e0b55f; border-radius: 6px; background: #fff7df; color: #8b5d15; font-size: 10px; font-weight: 750; }
    .high-board-toggle:hover { border-color: #c58d2b; background: #ffefbd; }
    .board-cell { min-height: 106px; overflow: hidden; padding: 10px 11px 12px; border-right: 1px solid var(--line); background: #fff; vertical-align: top; }
    .board-cell.has-content { background: linear-gradient(180deg,#fff 0%,#fcfdff 100%); }
    .board-cell.cell-match { background: #fffaf0; box-shadow: inset 0 0 0 2px #f0c36b; }
    .board-cell.selected-cell { background: #fff8e8; box-shadow: inset 0 0 0 2px #e4a62e; }
    .board-cell.cell-dim .stock-chip { opacity: .36; }
    .board-turnover { display: flex; align-items: center; gap: 5px; width: max-content; max-width: 100%; margin: 0 0 7px; padding: 3px 7px; border: 1px solid #d8e2f1; border-radius: 5px; background: #f5f8fd; color: #617491; font-size: 10px; line-height: 1.25; white-space: nowrap; }
    .board-turnover strong { color: #304d78; font-size: 11px; font-variant-numeric: tabular-nums; }
    .board-turnover.incomplete { border-color: #fed7aa; background: #fff7ed; color: #9a5b1a; }
    .board-turnover.incomplete strong { color: #9a4d0b; }
    .cell-empty { display: flex; align-items: flex-start; justify-content: center; min-height: 80px; padding-top: 23px; color: #d6deea; font-size: 18px; }
    .content-line { margin: 0 0 7px; line-height: 1.7; font-size: 12px; }
    .theme-line { margin: 1px 0 4px; color: #5d79a1; font-size: 11px; font-weight: 700; }
    .stock-chip { display: inline-flex; align-items: baseline; gap: 4px; margin: 0 4px 4px 0; padding: 3px 6px; border: 1px solid #d6e1f4; border-radius: 5px; background: #f7faff; color: #344f79; cursor: pointer; line-height: 1.2; white-space: nowrap; transition: .15s ease; }
    .stock-chip.bid-seal { border-color: #fecdd3; background: #fff1f2; color: #9f1239; }
    .stock-chip.old-dragon { border-color: #dfc57a; background: #fff8df; color: #76520b; font-weight: 700; box-shadow: inset 0 0 0 1px rgba(181,138,32,.05); }
    .stock-chip.bid-seal.old-dragon { background: linear-gradient(90deg,#fff1f2 0 50%,#fff8df 50% 100%); border-color: #dfc57a; color: #76520b; }
    .stock-chip.three-board-pool { border-color: #60a5fa; background: #eff6ff; color: #1d4ed8; font-weight: 700; box-shadow: 0 0 0 1px rgba(37,99,235,.10); }
    .stock-chip.bid-seal.three-board-pool { background: linear-gradient(90deg,#fff1f2 0 50%,#eff6ff 50% 100%); }
    .stock-chip.three-board-pool.old-dragon { background: linear-gradient(90deg,#fff8df 0 50%,#eff6ff 50% 100%); border-color: #cfae4d; color: #76520b; }
    .stock-chip.bid-seal.three-board-pool.old-dragon { background: linear-gradient(90deg,#fff1f2 0 33.333%,#fff8df 33.333% 66.666%,#eff6ff 66.666% 100%); }
    .stock-chip:hover, .stock-chip.match { border-color: #8eafea; background: var(--accent-soft); color: #2458bd; }
    .stock-chip.selected { border-color: #dc9824; background: #ffe4a3; color: #7b4c00; box-shadow: 0 0 0 2px rgba(220,152,36,.18); font-weight: 700; opacity: 1 !important; }
    .stock-chip.selected em { color: #9b6b1a; }
    .stock-chip.bid-seal.old-dragon:not(.selected):is(:hover,.match) { background: linear-gradient(90deg,#ffe4e6 0 50%,#fff1c2 50% 100%); }
    .stock-chip.bid-seal.three-board-pool:not(.selected):is(:hover,.match) { background: linear-gradient(90deg,#ffe4e6 0 50%,#dbeafe 50% 100%); }
    .stock-chip.old-dragon.three-board-pool:not(.selected):is(:hover,.match) { background: linear-gradient(90deg,#fff1c2 0 50%,#dbeafe 50% 100%); }
    .stock-chip.bid-seal.old-dragon.three-board-pool:not(.selected):is(:hover,.match) { background: linear-gradient(90deg,#ffe4e6 0 33.333%,#fff1c2 33.333% 66.666%,#dbeafe 66.666% 100%); }
    .stock-grid { display: flex; align-items: flex-start; gap: 10px; width: max-content; }
    .stock-group { display: grid; grid-template-columns: repeat(3, max-content); grid-auto-rows: min-content; align-content: start; gap: 4px 6px; }
    .stock-grid .stock-chip { margin: 0; }
    .stock-chip em { color: #8b9bb3; font: 9px ui-monospace,SFMono-Regular,Menlo,monospace; font-style: normal; }
    .stock-chip .stock-region { display: inline-flex; align-items: center; height: 15px; margin-left: 1px; padding: 0 4px; border: 1px solid rgba(100,116,139,.16); border-radius: 3px; background: rgba(241,245,249,.82); color: #64748b; font-size: 9px; font-weight: 650; line-height: 13px; }
    .stock-chip.selected .stock-region { border-color: rgba(155,107,26,.22); background: rgba(255,255,255,.42); color: #855a14; }
    .stock-chip .auction-pct { margin-left: 2px; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stock-chip .first-limit-time { margin-left: 2px; color: #b4533f; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stock-chip .bid-seal-amount { margin-left: 2px; padding: 1px 3px; border-radius: 3px; background: rgba(190,24,93,.08); color: #be185d; font-size: 9px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .auction-pct.positive { color: #d95c45; }
    .auction-pct.negative { color: #2b9c73; }
    .auction-pct.flat { color: #8b9bb3; }
    .promotion-failures { clear: both; margin-top: 7px; border: 1px solid #bbf7d0; border-radius: 7px; background: #f7fff9; }
    .promotion-failures > summary { display: inline-flex; align-items: center; gap: 4px; margin: 5px; padding: 3px 7px; border: 1px solid #86efac; border-radius: 5px; background: #ecfdf5; color: #15803d; cursor: pointer; font-size: 10px; font-weight: 700; list-style: none; user-select: none; }
    .promotion-failures > summary::-webkit-details-marker { display: none; }
    .promotion-failures > summary::before { content: '▸'; transition: transform .15s ease; }
    .promotion-failures[open] > summary::before { transform: rotate(90deg); }
    .promotion-failure-list { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 5px 6px; }
    .stock-chip.promotion-failure { border-color: #86efac; background: #ecfdf5; color: #166534; }
    .stock-chip.promotion-failure.is-broken { border-color: #fb923c; background: #fff7ed; color: #9a3412; }
    .stock-chip.promotion-failure:hover, .stock-chip.promotion-failure.match { border-color: #4ade80; background: #dcfce7; color: #14532d; }
    .stock-chip.promotion-failure.selected { border-color: #dc9824; background: #ffe4a3; color: #7b4c00; }
    .stock-chip.promotion-failure .promotion-metric { color: #16825d; font-size: 9px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stock-chip.promotion-failure .promotion-broken { display: inline-flex; align-items: center; justify-content: center; height: 15px; padding: 0 4px; border: 1px solid #ea580c; border-radius: 4px; background: #ffedd5; color: #c2410c; font-size: 8px; font-weight: 800; line-height: 1; }
    .stock-chip.promotion-failure.old-dragon { border-color: #cfae4d; background: linear-gradient(90deg,#ecfdf5 0 50%,#fff8df 50% 100%); color: #76520b; }
    .no-data { padding: 50px; color: var(--muted); text-align: center; font-size: 13px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(31,43,61,.24); backdrop-filter: blur(3px); }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(650px,100%); max-height: min(720px,90vh); overflow: auto; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 20px 70px rgba(31,43,61,.2); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 15px; }
    .modal h2 { margin: 0 0 5px; font-size: 20px; }
    .modal .code { color: var(--muted); font: 12px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .close { width: 30px; height: 30px; padding: 0; border-radius: 50%; font-size: 20px; line-height: 25px; }
    .history { display: grid; grid-template-columns: repeat(auto-fill,minmax(125px,1fr)); gap: 8px; }
    .history-item { padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcff; }
    .history-item time { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; }
    .history-item strong { font-size: 14px; }
    .history-item.recent { border-color: #b9d4fb; background: #f2f7ff; }
    .history-collapse { margin-top: 14px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcff; }
    .history-collapse > summary { display: flex; align-items: center; gap: 7px; padding: 10px 12px; color: var(--text); cursor: pointer; font-size: 13px; font-weight: 700; list-style: none; user-select: none; }
    .history-collapse > summary::-webkit-details-marker { display: none; }
    .history-collapse > summary::before { content: '▸'; color: #6b7f9e; transition: transform .15s ease; }
    .history-collapse[open] > summary::before { transform: rotate(90deg); }
    .history-count { color: var(--muted); font-size: 11px; font-weight: 400; }
    .history-collapse .history { padding: 0 10px 10px; }
    .search-history-modal { width: min(560px,100%); }
    .search-stock-list { display: grid; grid-template-columns: repeat(auto-fill,minmax(170px,1fr)); gap: 8px; }
    .search-stock-choice, .history-jump { height: auto; min-height: 48px; padding: 8px 10px; text-align: left; }
    .search-stock-choice { display: flex; align-items: center; justify-content: space-between; gap: 9px; background: #fbfcff; }
    .search-stock-choice strong { font-size: 13px; }
    .search-stock-choice span { color: var(--muted); font: 10px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .search-stock-choice small { color: #58729a; font-size: 10px; white-space: nowrap; }
    .search-history-list { display: grid; grid-template-columns: repeat(auto-fill,minmax(135px,1fr)); gap: 8px; }
    .history-jump { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-color: #d7e2f4; background: #f8faff; }
    .history-jump:hover { border-color: #8eafea; background: var(--accent-soft); }
    .history-jump time { color: #506887; font-size: 11px; }
    .history-jump strong { color: var(--up); font-size: 13px; }
    .search-empty { padding: 25px 8px; color: var(--muted); text-align: center; font-size: 12px; }
    .discussion-modal { width: min(760px,100%); }
    .discussion-tabs { display: flex; gap: 5px; margin: -3px 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .discussion-tab { height: 29px; padding: 0 11px; border-radius: 999px; color: var(--muted); font-size: 11px; }
    .discussion-tab.active { border-color: var(--accent); background: var(--accent); color: #fff; }
    .discussion-body { min-height: 160px; white-space: pre-wrap; color: var(--text); font-size: 13px; line-height: 1.8; }
    .discussion-section + .discussion-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
    .discussion-source-title { margin-bottom: 7px; font-size: 14px; font-weight: 700; }
    .discussion-source-link { display: inline-block; margin-bottom: 9px; color: var(--accent); font-size: 11px; }
    .utility-loading, .utility-empty, .utility-error { padding: 35px 8px; color: var(--muted); text-align: center; }
    .utility-error { color: #b42318; }
    .stats-modal { width: min(900px,100%); }
    .stats-meta { margin: -4px 0 10px; color: var(--muted); font-size: 11px; }
    .stats-body { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .stats-card { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcff; }
    .stats-card.wide { grid-column: 1/-1; }
    .stats-card h3 { margin: 0 0 9px; font-size: 13px; }
    .stats-card h3 small { margin-left: 5px; color: var(--muted); font-size: 10px; font-weight: 400; }
    .stats-tags, .stats-selection-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .stats-tag, .stats-selection-stock { height: auto; min-height: 27px; padding: 4px 8px; border-radius: 999px; background: #f7faff; color: #49658e; font-size: 11px; }
    .stats-tag.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .stats-tag b { margin-left: 5px; color: var(--accent); }
    .stats-selection { display: none; border-color: #b9d4fb; background: #f7faff; }
    .stats-selection.show { display: block; }
    .stats-selection-title { margin-bottom: 8px; font-size: 12px; font-weight: 700; }
    .stats-selection-stock { border-radius: 6px; font-weight: 650; }
    .stats-selection-stock small { margin-left: 4px; color: var(--muted); font: 9px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .stats-lock-list { display: grid; grid-template-columns: repeat(auto-fill,minmax(270px,1fr)); gap: 6px; max-height: 360px; overflow: auto; }
    .stats-lock-stock { display: grid; grid-template-columns: minmax(0,1fr) 88px 70px; align-items: center; gap: 7px; height: auto; min-height: 46px; padding: 5px 7px; border-radius: 6px; background: #fbfcff; color: var(--text); font-size: 11px; text-align: left; }
    .stats-lock-stock span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stats-lock-stock b { flex: 0 0 auto; color: #15803d; font: 700 10px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .stats-lock-spark { position: relative; display: block; width: 88px; height: 34px; color: #94a3b8; }
    .stats-lock-spark svg { display: block; width: 88px; height: 26px; overflow: visible; }
    .stats-lock-spark em { position: absolute; right: 0; bottom: -1px; color: #b45309; font: 700 8px ui-monospace,SFMono-Regular,Menlo,monospace; font-style: normal; }
    .stats-lock-spark em.hot { color: #dc2626; }
    .stats-lock-value { display: grid; justify-items: end; gap: 2px; }
    .stats-lock-value small { color: var(--muted); font-size: 8px; }
    .summary-modal { width: min(760px, 94vw); }
    .summary-modal .modal-head { align-items: flex-start; }
    .summary-editor { display: block; width: 100%; min-height: 360px; box-sizing: border-box; padding: 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); font: 13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace; resize: vertical; outline: none; }
    .summary-editor:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .summary-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
    .summary-status { color: var(--muted); font-size: 11px; }
    .summary-save { padding: 6px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 650; cursor: pointer; }
    .summary-save:disabled { opacity: .55; cursor: wait; }
    .stats-list { display: grid; gap: 5px; }
    .stats-row { display: grid; grid-template-columns: 22px minmax(80px,.7fr) minmax(0,1.3fr) 48px; gap: 6px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 6px; font-size: 10px; }
    .stats-rank { color: var(--muted); text-align: center; }.stats-stock { overflow: hidden; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }.stats-evidence { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }.stats-score { color: var(--accent); font-weight: 700; text-align: right; }
    .stats-history-list { display: grid; gap: 6px; max-height: 360px; overflow: auto; }
    .stats-history-collapse { border: 1px solid var(--line); border-radius: 7px; background: #fff; overflow: hidden; }
    .stats-history-collapse > summary { display: flex; align-items: center; gap: 7px; padding: 9px 10px; color: #49658e; cursor: pointer; font-size: 11px; font-weight: 700; list-style: none; user-select: none; }
    .stats-history-collapse > summary::-webkit-details-marker { display: none; }
    .stats-history-collapse > summary::before { content: '▸'; color: #6b7f9e; transition: transform .15s ease; }
    .stats-history-collapse[open] > summary::before { transform: rotate(90deg); }
    .stats-history-collapse > summary small { margin-left: auto; color: var(--muted); font-size: 10px; font-weight: 500; }
    .stats-history-collapse .stats-history-list { padding: 0 8px 8px; border-top: 1px solid var(--line); }

        const d = found && found.data;

          els.detailSummary.innerHTML = '<div class="empty-detail">暂无股票详情数据</div>';
          els.detailModel.textContent = '暂未填写';
          els.detailConcepts.innerHTML = '<div class="empty-detail">暂无题材概念数据</div>';
          els.detailShareholders.innerHTML = '<div class="empty-detail">暂无股东和股本数据</div>';
          return;
        }
        const region = d.r || '暂无';
        const marketDate = typeof SD_META !== 'undefined' && SD_META.marketCapDate ? `（${SD_META.marketCapDate}）` : '';
        const summary = [
          ['地域 / 行业', region],
          ['总市值', formatMarketCap(d.mv) ? `${formatMarketCap(d.mv)}${marketDate}` : '暂无'],
          ['总股本', formatShares(d.h && d.h.ts) || '暂无'],
          ['流通股本', formatShares(d.h && d.h.cs) || '暂无']
        ];
        els.detailSummary.innerHTML = summary.map(item => `<div class="summary-item"><small>${escapeHtml(item[0])}</small><strong>${escapeHtml(item[1])}</strong></div>`).join('');
        els.detailModel.textContent = String(d.model || '').trim() || '暂未填写';
        const tags = String(d.t || '').split(',').map(item => item.trim()).filter(Boolean);
        const explanations = Array.isArray(d.e) ? d.e : [];
        const tagHtml = tags.length ? `<div class="concept-pills">${tags.map(tag => `<span class="concept-pill">${escapeHtml(tag)}</span>`).join('')}</div>` : '<div class="empty-detail">暂无概念标签</div>';
        const explanationHtml = explanations.map(item => `<div class="concept-explanation"><strong>${escapeHtml(item[0] || '')}</strong><div>${escapeHtml(item[1] || '')}</div></div>`).join('');
        els.detailConcepts.innerHTML = tagHtml + explanationHtml;
        const h = d.h || {};
        const shareCards = [
          ['控股股东', h.c || '暂无'],
          ['第一大股东持股', h.t ? `${h.t}%` : '暂无'],
          ['前十大合计持股', h.tt ? `${h.tt}%` : '暂无'],
          ['流通股占比', h.rt ? `${h.rt}%` : '暂无']
        ];
        let shareholders = `<div class="share-grid">${shareCards.map(item => `<div class="summary-item"><small>${escapeHtml(item[0])}</small><strong>${escapeHtml(String(item[1]))}</strong></div>`).join('')}</div>`;
        const top10 = Array.isArray(h.top10) ? h.top10 : [];
        const floatTop10 = Array.isArray(h.floatTop10) ? h.floatTop10 : [];
        const ratioTotal = rows => rows.reduce((sum, holder) => {
          const value = Number(holder && holder.r);
          return Number.isFinite(value) ? sum + value : sum;
        }, 0);
        const holderColumn = (title, rows, total, period) => {
          const list = rows.length ? `<div class="top10-list">${rows.map((holder, index) => `<div class="top10-item"><span class="top10-name">${index + 1}. ${escapeHtml(holder.n || '')}</span><span class="top10-ratio">${holder.r || 0}%</span><span class="top10-change">${escapeHtml(holder.c || '')}</span></div>`).join('')}</div>` : '<div class="empty-detail">暂无数据</div>';
          return `<div class="shareholder-column"><h4>${title}<span class="shareholder-total">${rows.length ? `合计 ${total.toFixed(2)}%${period ? ` · ${escapeHtml(period)}` : ''}` : ''}</span></h4>${list}</div>`;
        };
        shareholders += `<div class="shareholder-columns">${holderColumn('十大股东', top10, ratioTotal(top10), '')}${holderColumn('十大流通股东', floatTop10, Number.isFinite(Number(h.floatTop10TotalRatio)) ? Number(h.floatTop10TotalRatio) : ratioTotal(floatTop10), h.floatTop10ReportPeriod || '')}</div>`;
        els.detailShareholders.innerHTML = shareholders;
      }
      function currentStockDetail() {
        const stock = state.stockHistory.get(state.detailCode);
        return findStockDetail(state.detailCode, stock && stock.name || '');
      }
      function setModelEditor(open) {
        if (!els.detailModelEditor || !els.detailModelInput) return;
        if (open) {
          const found = currentStockDetail();
          if (!found || !found.data) {
            els.detailModelStatus.textContent = '股票详情尚未加载，请稍后再试';
            return;
          }
          els.detailModelInput.value = String(found.data.model || '');
          els.detailModelStatus.textContent = '';
          els.detailModelEditor.hidden = false;
          els.detailModelEdit.textContent = '收起';
          setTimeout(() => els.detailModelInput.focus(), 0);
        } else {
          els.detailModelEditor.hidden = true;
          els.detailModelEdit.textContent = '编辑';
        }
      }
      function saveModelData() {
        const found = currentStockDetail();
        if (!found || !found.data) {
          els.detailModelStatus.textContent = '缺少股票详情，无法保存';
          return;
        }
        const model = String(els.detailModelInput.value || '').trim();
        els.detailModelSave.disabled = true;
        els.detailModelSave.textContent = '保存中';
        els.detailModelStatus.textContent = '正在写入 stock_detail_map.js…';
        fetch(STOCK_DETAIL_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: found.name, model }) })
          .then(response => response.json())
          .then(result => {
            if (!result || !result.ok) throw new Error(result && result.error || '服务未确认保存');
            if (model) found.data.model = model; else delete found.data.model;
            els.detailModel.textContent = model || '暂未填写';
            els.detailModelStatus.textContent = '已保存 ✓';
            setModelEditor(false);
          })
          .catch(error => {
            els.detailModelStatus.textContent = '保存失败：请确认笔记服务已启动';
            console.error('模型制作保存失败', error);
          })
          .finally(() => {
            els.detailModelSave.disabled = false;
            els.detailModelSave.textContent = '保存';
          });
      }
      function jumpToDate(value) {
        const query = String(value || '').trim();
        if (!query) return;
        const digits = query.replace(/\D/g, '');
        const exactIndex = state.dateIndex.get(query);
        const index = Number.isInteger(exactIndex) ? exactIndex : state.dates.findIndex(date => {
          const normalized = date.replace(/\D/g, '');
          return date === query || normalized === digits || (digits.length >= 4 && normalized.endsWith(digits));
        });
        if (index < 0) {
          els.hint.textContent = `没有找到日期“${query}”，可输入完整日期，例如 2026-08-07。`;
          return;
        }
        els.viewport.scrollLeft = Math.max(0, (state.columnOffsets[index] - 12) * (state.zoom || 1));
        syncVirtualWindow(true);
        els.hint.textContent = `已定位到 ${state.dates[index]}；横向滚动可继续查看相邻日期。`;
      }
      function showHistory(code, name, selectedDate) {
        const stock = state.stockHistory.get(code); if (!stock) return;
        const titleName = stock.name || name || code;
        const reasonDate = selectedDate || stock.days[0]?.date || '';
        state.detailCode = code;
        state.detailDate = reasonDate;
        els.modalTitle.textContent = titleName;
        els.modalCode.textContent = `${code}${reasonDate ? ` · ${reasonDate}` : ''}`;
        selectStock(code);
        els.detailSummary.innerHTML = '<div class="empty-detail">正在加载股票详情…</div>';
        renderOldDragonControl();
        renderPoolControl();
        setModelEditor(false);
        els.detailModel.textContent = '正在加载…';
        els.detailConcepts.innerHTML = '';
        els.detailShareholders.innerHTML = '';
        els.historyCollapse.open = false;
        els.historyCount.textContent = `（${stock.days.length}次）`;
        els.history.innerHTML = stock.days.map(item => `<div class="history-item ${item.date === reasonDate ? 'recent' : ''}"><time>${item.date}</time><strong>${item.board}板</strong></div>`).join('');
        els.modal.classList.add('open');
        renderDetailKline(titleName, code);
        renderDetailMedia(titleName, code, reasonDate);
        ensureLimitReasonData(reasonDate, code);
        ensureStockDetailData().then(() => renderStockDetail(titleName, code)).catch(error => {
          els.detailSummary.innerHTML = `<div class="empty-detail">${escapeHtml(error.message || '股票详情数据加载失败')}</div>`;
          els.detailModel.textContent = '暂未填写';
          els.detailConcepts.innerHTML = '<div class="empty-detail">请检查 stock_detail_map.js 是否与网页位于同一目录。</div>';
          els.detailShareholders.innerHTML = '';
        });
      }
      els.body.addEventListener('click', event => {
        const highBoardToggle = event.target.closest('.high-board-toggle');
        if (highBoardToggle) {
          state.highBoardsCollapsed = !state.highBoardsCollapsed;
          try { localStorage.setItem('zt-multi-day-high-boards-collapsed', state.highBoardsCollapsed ? '1' : '0'); } catch (_) {}
          renderRows(state.dates.slice(state.windowStart, state.windowEnd));
          updateStatus();
          return;
        }
        const chip = event.target.closest('.stock-chip');
        if (!chip || !els.body.contains(chip)) return;
        event.stopPropagation();
        selectStock(chip.dataset.code);
      });
      els.body.addEventListener('toggle', event => {
        const details = event.target.closest && event.target.closest('.promotion-failures');
        if (!details || !details.open || details.dataset.loaded === '1') return;
        const list = details.querySelector('.promotion-failure-list');
        if (list) list.innerHTML = renderPromotionFailureChips(details.dataset.date, Number(details.dataset.board));
        details.dataset.loaded = '1';
      }, true);
      els.body.addEventListener('dblclick', event => {
        const chip = event.target.closest('.stock-chip');
        if (!chip || !els.body.contains(chip)) return;
        event.preventDefault();
        event.stopPropagation();
        const cell = chip.closest('.board-cell');
        showHistory(chip.dataset.code, chip.dataset.name, cell && cell.dataset.date || '');
      });
      els.header.addEventListener('click', event => {
        const button = event.target.closest('[data-date-action]');
        if (!button || !els.header.contains(button)) return;
        event.preventDefault();
        event.stopPropagation();
        const date = button.dataset.date, action = button.dataset.dateAction;
        if (!date) return;
        if (action === 'stats') showStats(date);
        else if (action === 'posts' || action === 'replies') showDiscussion(date, action);
        else if (action === 'summary') showSummary(date);
      });
      els.viewport.addEventListener('scroll', scheduleVirtualWindow, { passive: true });
      els.viewport.addEventListener('wheel', event => { if (event.shiftKey && Math.abs(event.deltaY) > Math.abs(event.deltaX)) { event.preventDefault(); els.viewport.scrollLeft += event.deltaY; } }, { passive: false });
      els.search.addEventListener('input', () => {
        clearTimeout(state.searchTimer);
        state.searchTimer = setTimeout(() => {
          state.query = els.search.value.trim().toLowerCase();
          renderWindow(true);
          const exact = matchingStocks(state.query).find(stock => stockExactMatch(stock, state.query));
          if (exact) showStockDateChoices(exact);
        }, 120);
      });
      els.search.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        clearTimeout(state.searchTimer);
        state.query = els.search.value.trim().toLowerCase();
        renderWindow(true);
        openSearchHistory(els.search.value);
      });
      els.searchBtn.addEventListener('click', () => openSearchHistory(els.search.value));
      els.searchHistoryBody.addEventListener('click', event => {
        const stockButton = event.target.closest('[data-search-code]');
        if (stockButton) {
          showStockDateChoices(state.stockHistory.get(stockButton.dataset.searchCode));
          return;
        }
        const dateButton = event.target.closest('[data-jump-date]');
        if (dateButton) jumpToStockDate(dateButton.dataset.jumpCode, dateButton.dataset.jumpDate);
      });
      els.dateSearchBtn.addEventListener('click', () => jumpToDate(els.dateSearch.value));
      els.dateSearch.addEventListener('keydown', event => { if (event.key === 'Enter') jumpToDate(els.dateSearch.value); });
      els.zoomSelect.addEventListener('change', () => applyZoom(els.zoomSelect.value));
      els.zoomOut.addEventListener('click', () => applyZoom((state.zoom || 1) - 0.1));
      els.zoomIn.addEventListener('click', () => applyZoom((state.zoom || 1) + 0.1));
      els.initialDays.addEventListener('change', () => {
        state.windowSize = Math.max(12, Number(els.initialDays.value) || 30);
        syncVirtualWindow(true);
      });
      els.todayBtn.addEventListener('click', () => { els.viewport.scrollLeft = 0; syncVirtualWindow(true); });
      els.clearSelection.addEventListener('click', () => selectStock(''));
      els.reloadBtn.addEventListener('click', loadData);
      els.mobilePanelToggle.addEventListener('click', toggleMobilePanel);
      window.addEventListener('resize', syncMobilePanel, { passive: true });
      els.detailModelEdit.addEventListener('click', () => setModelEditor(els.detailModelEditor.hidden));
      els.detailModelCancel.addEventListener('click', () => setModelEditor(false));
      els.detailModelSave.addEventListener('click', saveModelData);
      els.detailPoolToggle.addEventListener('click', toggleThreeBoardPool);
      els.detailOldDragonToggle.addEventListener('click', toggleOldDragon);
      els.detailKlineRefresh.addEventListener('click', () => {
        if (!state.detailCode) return;
        const stock = state.stockHistory.get(state.detailCode);
        renderDetailKline(stock && stock.name || state.detailCode, state.detailCode);
      });
      els.modalClose.addEventListener('click', closeDetailModal);
      els.modal.addEventListener('click', event => { if (event.target === els.modal) closeDetailModal(); });
      els.discussionClose.addEventListener('click', closeDiscussion);
      els.discussionModal.addEventListener('click', event => { if (event.target === els.discussionModal) closeDiscussion(); });
      els.discussionModal.querySelectorAll('[data-discussion-author]').forEach(tab => tab.addEventListener('click', () => {
        discussionState.author = tab.dataset.discussionAuthor;
        renderDiscussion();
      }));
      els.statsClose.addEventListener('click', closeStats);
      els.statsModal.addEventListener('click', event => { if (event.target === els.statsModal) closeStats(); });
      els.statsBody.addEventListener('click', event => {
        const historyDate = event.target.closest('[data-stats-history-date]');
        if (historyDate) { closeStats();jumpToDate(historyDate.dataset.statsHistoryDate);return; }
        const tag = event.target.closest('[data-stats-token]');
        if (tag) { showStatsSelection(tag.dataset.statsToken, tag);return; }
        const button = event.target.closest('[data-stats-stock]');
        if (!button) return;
        const stock = statsStocks.get(button.dataset.statsStock), date = statsDate;
        if (!stock) return;
        closeStats();
        showHistory(stock.code, stock.name, date);
      });
      els.searchHistoryClose.addEventListener('click', () => els.searchHistoryModal.classList.remove('open'));
      els.searchHistoryModal.addEventListener('click', event => { if (event.target === els.searchHistoryModal) els.searchHistoryModal.classList.remove('open'); });
      els.summaryClose.addEventListener('click', closeSummary);
      els.summarySave.addEventListener('click', saveSummary);
      els.summaryModal.addEventListener('click', event => { if (event.target === els.summaryModal) closeSummary(); });
      document.addEventListener('keydown', event => {
        if ((event.metaKey || event.ctrlKey) && !event.altKey) {
          if (event.key === '+' || event.key === '=') { event.preventDefault(); applyZoom((state.zoom || 1) + 0.1); return; }
          if (event.key === '-') { event.preventDefault(); applyZoom((state.zoom || 1) - 0.1); return; }
          if (event.key === '0') { event.preventDefault(); applyZoom(1); return; }
        }
        if (event.key !== 'Escape') return;
        closeDetailModal();
        closeDiscussion();
        closeStats();
        els.searchHistoryModal.classList.remove('open');
        closeSummary();
      });
      state.zoom = readStoredZoom();
      try {
        const savedHighBoards = localStorage.getItem('zt-multi-day-high-boards-collapsed');
        state.highBoardsCollapsed = savedHighBoards === null ? true : savedHighBoards === '1';
      } catch (_) { state.highBoardsCollapsed = true; }
      syncMobilePanel();
      loadData();
    })();
  </script>
</body>
</html>
