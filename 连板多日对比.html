<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>连板多日对比</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #fff;
      --line: #e5eaf2;
      --line-strong: #cfd9e8;
      --text: #253247;
      --muted: #7b8799;
      --accent: #3b6fe8;
      --up: #d95c45;
      --accent-soft: #edf3ff;
      --label-width: 112px;
      --cell-width: 290px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif; }
    body { padding: 22px; }
    .page { max-width: 2100px; margin: 0 auto; }
    .control-panel { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-bottom: 10px; padding: 8px 10px; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; box-shadow: 0 5px 18px rgba(45,68,104,.05); scrollbar-width: thin; }
    .topbar { display: flex; flex: 0 0 auto; align-items: center; gap: 10px; margin: 0; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .02em; line-height: 34px; white-space: nowrap; }
    .subtitle { display: none; }
    .status { max-width: 150px; overflow: hidden; color: var(--muted); font-size: 11px; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .toolbar { display: flex; flex: 1 0 auto; align-items: center; flex-wrap: nowrap; gap: 7px; padding: 0; background: transparent; border: 0; border-radius: 0; box-shadow: none; }
    .toolbar label { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .toolbar input#search { width: 170px; }
    .toolbar input#dateSearch { width: 125px; }
    input, select, button { height: 34px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--text); font: inherit; font-size: 13px; }
    input { width: 195px; padding: 0 10px; }
    select, button { padding: 0 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    button.primary:hover { color: #fff; background: #2d5ed0; }
    .legend { display: none; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { display: inline-block; width: 17px; height: 11px; border-radius: 3px; }
    .legend .board-mark { background: #f0f4fb; border: 1px solid #d4deed; }
    .legend .stock-mark { background: var(--accent-soft); border: 1px solid #bdd0f7; }
    .legend .empty-mark { background: #fafbfe; border: 1px dashed #dce3ef; }
    .hint { flex: 0 1 210px; min-width: 0; margin: 0; overflow: hidden; color: var(--muted); font-size: 11px; line-height: 16px; text-overflow: ellipsis; white-space: nowrap; }
    .viewport { position: relative; height: calc(100vh - 105px); min-height: 500px; overflow: auto; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); box-shadow: 0 8px 28px rgba(45,68,104,.07); overscroll-behavior: contain; scrollbar-color: #bdc8d9 #f3f6fa; }
    .matrix { min-width: calc(var(--label-width) + var(--cell-width)); }
    .matrix-header, .board-row { display: grid; width: max-content; }
    .board-row { grid-template-columns: var(--date-template); }
    .matrix-header { position: sticky; top: 0; z-index: 10; height: 59px; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line-strong); }
    .corner, .board-label { position: sticky; left: 0; z-index: 4; background: #fff; }
    .corner { display: flex; align-items: center; padding: 0 12px; border-right: 1px solid var(--line-strong); color: var(--muted); font-size: 12px; }
    .date-head { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; border-right: 1px solid var(--line); color: var(--text); font-size: 12px; }
    .date-head small { color: var(--muted); font-size: 10px; }
    .board-row { border-bottom: 1px solid var(--line-strong); }
    .board-label { display: flex; align-items: flex-start; justify-content: center; padding-top: 18px; border-right: 1px solid var(--line-strong); color: #58729a; font-size: 15px; font-weight: 700; }
    .board-label.high { color: var(--up); }
    .board-cell { min-height: 106px; overflow: hidden; padding: 10px 11px 12px; border-right: 1px solid var(--line); background: #fff; vertical-align: top; }
    .board-cell.has-content { background: linear-gradient(180deg,#fff 0%,#fcfdff 100%); }
    .board-cell.cell-match { background: #fffaf0; box-shadow: inset 0 0 0 2px #f0c36b; }
    .board-cell.selected-cell { background: #fff8e8; box-shadow: inset 0 0 0 2px #e4a62e; }
    .board-cell.cell-dim .stock-chip { opacity: .36; }
    .cell-empty { display: flex; align-items: flex-start; justify-content: center; min-height: 80px; padding-top: 23px; color: #d6deea; font-size: 18px; }
    .content-line { margin: 0 0 7px; line-height: 1.7; font-size: 12px; }
    .theme-line { margin: 1px 0 4px; color: #5d79a1; font-size: 11px; font-weight: 700; }
    .stock-chip { display: inline-flex; align-items: baseline; gap: 4px; margin: 0 4px 4px 0; padding: 3px 6px; border: 1px solid #d6e1f4; border-radius: 5px; background: #f7faff; color: #344f79; cursor: pointer; line-height: 1.2; white-space: nowrap; transition: .15s ease; }
    .stock-chip.bid-seal { border-color: #fecdd3; background: #fff1f2; color: #9f1239; }
    .stock-chip.three-board-pool { border-color: #60a5fa; background: #eff6ff; color: #1d4ed8; font-weight: 700; box-shadow: 0 0 0 1px rgba(37,99,235,.10); }
    .stock-chip.bid-seal.three-board-pool { background: linear-gradient(90deg,#fff1f2 0 6px,#eff6ff 6px); }
    .stock-chip:hover, .stock-chip.match { border-color: #8eafea; background: var(--accent-soft); color: #2458bd; }
    .stock-chip.selected { border-color: #dc9824; background: #ffe4a3; color: #7b4c00; box-shadow: 0 0 0 2px rgba(220,152,36,.18); font-weight: 700; opacity: 1 !important; }
    .stock-chip.selected em { color: #9b6b1a; }
    .stock-grid { display: flex; align-items: flex-start; gap: 10px; width: max-content; }
    .stock-group { display: grid; grid-template-columns: repeat(3, max-content); grid-auto-rows: min-content; align-content: start; gap: 4px 6px; }
    .stock-grid .stock-chip { margin: 0; }
    .stock-chip em { color: #8b9bb3; font: 9px ui-monospace,SFMono-Regular,Menlo,monospace; font-style: normal; }
    .stock-chip .auction-pct { margin-left: 2px; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .auction-pct.positive { color: #d95c45; }
    .auction-pct.negative { color: #2b9c73; }
    .auction-pct.flat { color: #8b9bb3; }
    .no-data { padding: 50px; color: var(--muted); text-align: center; font-size: 13px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(31,43,61,.24); backdrop-filter: blur(3px); }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(650px,100%); max-height: min(720px,90vh); overflow: auto; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 20px 70px rgba(31,43,61,.2); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 15px; }
    .modal h2 { margin: 0 0 5px; font-size: 20px; }
    .modal .code { color: var(--muted); font: 12px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .close { width: 30px; height: 30px; padding: 0; border-radius: 50%; font-size: 20px; line-height: 25px; }
    .history { display: grid; grid-template-columns: repeat(auto-fill,minmax(125px,1fr)); gap: 8px; }
    .history-item { padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcff; }
    .history-item time { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; }
    .history-item strong { font-size: 14px; }
    .history-item.recent { border-color: #b9d4fb; background: #f2f7ff; }
    .detail-summary { display: grid; grid-template-columns: repeat(auto-fit,minmax(145px,1fr)); gap: 7px; margin-bottom: 14px; }
    .summary-item { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcff; }
    .summary-item small { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; }
    .summary-item strong { font-size: 13px; font-weight: 650; }
    .detail-section { margin-top: 14px; }
    .detail-section h3 { margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 13px; }
    .concept-pills { display: flex; flex-wrap: wrap; gap: 5px; }
    .concept-pill { padding: 3px 7px; border: 1px solid #d7e2f4; border-radius: 5px; background: #f7faff; color: #49658e; font-size: 11px; }
    .concept-explanation { margin-top: 8px; padding: 8px 10px; border-left: 3px solid #c8d7f2; background: #fafcff; color: #59677c; font-size: 12px; line-height: 1.65; }
    .concept-explanation strong { color: #3c5780; }
    .share-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(145px,1fr)); gap: 7px; }
    .top10-list { margin-top: 9px; border-top: 1px solid var(--line); }
    .top10-item { display: grid; grid-template-columns: minmax(0,1fr) 54px auto; gap: 7px; padding: 6px 0; border-bottom: 1px solid #f0f2f6; font-size: 11px; }
    .top10-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top10-ratio { color: #49658e; text-align: right; }
    .top10-change { color: var(--muted); text-align: right; }
    .shareholder-columns { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; margin-top: 9px; }
    .shareholder-column { min-width: 0; }
    .shareholder-column h4 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0; padding: 7px 0; color: #58729a; font-size: 12px; }
    .shareholder-total { color: var(--muted); font-size: 10px; font-weight: 400; white-space: nowrap; }
    .shareholder-column .top10-list { margin-top: 0; }
    .empty-detail { color: var(--muted); font-size: 12px; }
    @media (max-width: 1200px) {
      .control-panel { flex-wrap: wrap; align-items: center; }
      .toolbar { flex-basis: 100%; overflow-x: auto; padding-bottom: 2px; }
      .hint { flex-basis: 100%; }
      .viewport { height: calc(100vh - 155px); }
    }
    @media (max-width: 720px) {
      .shareholder-columns { grid-template-columns: 1fr; }
      body { padding: 12px; }
      .control-panel { align-items: flex-start; gap: 6px 10px; }
      .topbar { align-items: center; flex-direction: row; gap: 8px; }
      .status { text-align: left; }
      .toolbar { flex-wrap: wrap; row-gap: 6px; }
      .hint { flex-basis: 100%; }
      .viewport { height: calc(100vh - 175px); min-height: 430px; }
      input { width: 160px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="control-panel">
      <header class="topbar">
        <div>
          <h1>连板多日对比</h1>
          <div class="subtitle">纵轴：连板层级　·　横轴：交易日期（近 → 远）　·　按钮显示当日 9:25 竞价涨幅　·　单击高亮，双击查看历史涨停和股票详情</div>
        </div>
        <div class="status" id="status">正在读取涨停数据…</div>
      </header>
      <section class="toolbar">
        <label for="search">搜索股票</label>
        <input id="search" type="search" placeholder="名称或代码，匹配后高亮">
        <label for="dateSearch">按日期</label>
        <input id="dateSearch" type="search" placeholder="如 2026-08-07" aria-label="按日期定位">
        <button id="dateSearchBtn">定位日期</button>
        <label for="initialDays">初始天数</label>
        <select id="initialDays">
          <option value="12">12天</option>
          <option value="24" selected>24天</option>
          <option value="40">40天</option>
          <option value="80">80天</option>
          <option value="all">全部</option>
        </select>
        <button class="primary" id="todayBtn">回到最近</button>
        <button id="clearSelection">取消股票高亮</button>
        <button id="reloadBtn">重新读取</button>
      </section>
      <div class="hint" id="hint">单击股票按钮同步高亮全部历史位置，双击打开详情；横向滚动到最右侧会自动加载更早日期。</div>
    </div>
    <section class="viewport" id="viewport" aria-label="连板多日对比矩阵">
      <div class="matrix" id="matrix">
        <div class="matrix-header" id="matrixHeader"></div>
        <div id="matrixBody"></div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div><h2 id="modalTitle">股票连板历史</h2><div class="code" id="modalCode"></div></div>
        <button class="close" id="modalClose" aria-label="关闭">×</button>
      </div>
      <div class="detail-summary" id="detailSummary"></div>
      <section class="detail-section"><h3>题材概念</h3><div id="detailConcepts"></div></section>
      <section class="detail-section"><h3>股东与股本信息</h3><div id="detailShareholders"></div></section>
      <section class="detail-section"><h3>历史涨停</h3></section>
      <div class="history" id="history"></div>
    </div>
  </div>

  <script src="zt_data.js"></script>
  <script src="stock_detail_map.js?v=20260819-float1"></script>
  <script src="bid_seal_data.js"></script>
  <script src="three_board_pool.js?v=20260818-2"></script>
  <script src="zt_auction_change_data.js"></script>
  <script>
    (() => {
      'use strict';
      const LABEL_WIDTH = 112, CELL_WIDTH = 290, BATCH_SIZE = 24;
      const BOARD_TEXT = { '首板': 1, '一板': 1, '二板': 2, '三板': 3, '四板': 4, '五板': 5, '六板': 6, '七板': 7, '八板': 8, '九板': 9, '十板': 10 };
      const AUCTION_DATA = window.ZT_AUCTION_CHANGE_DATA || { dates: {} };
      const BID_DATA = typeof BID !== 'undefined' && BID ? BID : {};
      const BID_CODES_BY_DATE = new Map(Object.entries(BID_DATA).map(([date, rows]) => [
        date,
        new Set((Array.isArray(rows) ? rows : []).map(item => String(item && item.c || '').trim()).filter(Boolean))
      ]));
      const THREE_BOARD_POOL_DATA = window.THREE_BOARD_POOL_DATA || { stocks: [] };
      const THREE_BOARD_POOL_CODES = new Set((Array.isArray(THREE_BOARD_POOL_DATA.stocks) ? THREE_BOARD_POOL_DATA.stocks : []).map(item => String(item && item.c || '').trim()).filter(Boolean));
      const els = {
        viewport: document.getElementById('viewport'), matrix: document.getElementById('matrix'), header: document.getElementById('matrixHeader'), body: document.getElementById('matrixBody'),
        status: document.getElementById('status'), hint: document.getElementById('hint'), search: document.getElementById('search'), dateSearch: document.getElementById('dateSearch'), dateSearchBtn: document.getElementById('dateSearchBtn'), initialDays: document.getElementById('initialDays'), todayBtn: document.getElementById('todayBtn'), clearSelection: document.getElementById('clearSelection'), reloadBtn: document.getElementById('reloadBtn'),
        modal: document.getElementById('modalBackdrop'), modalTitle: document.getElementById('modalTitle'), modalCode: document.getElementById('modalCode'), detailSummary: document.getElementById('detailSummary'), detailConcepts: document.getElementById('detailConcepts'), detailShareholders: document.getElementById('detailShareholders'), history: document.getElementById('history'), modalClose: document.getElementById('modalClose')
      };
      const state = { records: [], dates: [], stockHistory: new Map(), maxBoard: 1, visibleCount: 24, query: '', selectedCode: '' };

      function boardNumber(value) {
        const text = String(value || '').trim();
        return BOARD_TEXT[text] || 0;
      }
      function stockMatches(line) { return /([^，,、；;\s]+?)（[^）]*）(\d{6})/g.test(line); }
      function parseRecord(item) {
        const sections = new Map();
        let board = 0;
        for (const raw of String(item.t || '').split(/\r?\n/)) {
          const line = raw.trim();
          const next = boardNumber(line);
          if (next) { board = next; sections.set(board, []); continue; }
          if (board && line) sections.get(board).push(line);
        }
        return { date: item.d, sections };
      }
      function buildStockHistory() {
        state.stockHistory = new Map();
        for (const record of state.records) {
          for (const [board, lines] of record.sections) {
            for (const line of lines) {
              for (const match of line.matchAll(/([^，,、；;\s]+?)（[^）]*）(\d{6})/g)) {
                const name = match[1], code = match[2];
                if (!state.stockHistory.has(code)) state.stockHistory.set(code, { name, code, days: [] });
                state.stockHistory.get(code).days.push({ date: record.date, board });
              }
            }
          }
        }
      }
      function loadData() {
        const list = (typeof P !== 'undefined' && Array.isArray(P)) ? P : [];
        state.records = list.map(parseRecord).filter(record => record.date).sort((a, b) => b.date.localeCompare(a.date));
        state.dates = state.records.map(record => record.date);
        state.maxBoard = Math.max(1, ...state.records.flatMap(record => [...record.sections.keys()]));
        buildStockHistory();
        const requested = els.initialDays.value === 'all' ? state.dates.length : Number(els.initialDays.value) || 24;
        state.visibleCount = Math.min(requested, state.dates.length);
        render();
      }
      function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
      function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }
      function dateLabel(date) { const p = date.split('-'); return `${p[1]}/${p[2]}`; }
      function weekday(date) { return ['日','一','二','三','四','五','六'][new Date(`${date}T00:00:00`).getDay()]; }
      function activeDates() { return state.dates.slice(0, state.visibleCount); }
      function stockCount(lines) {
        return lines.reduce((total, line) => total + [...line.matchAll(/([^，,、；;\s]+?)（[^）]*）(\d{6})/g)].length, 0);
      }
      function auctionPctMarkup(date, code) {
        const day = AUCTION_DATA.dates && AUCTION_DATA.dates[date];
        const value = day && day.values ? Number(day.values[code]) : NaN;
        if (!Number.isFinite(value)) return '';
        const sign = value > 0 ? '+' : '';
        const cls = value > 0 ? 'positive' : value < 0 ? 'negative' : 'flat';
        const sourceDate = day.sourceDate && day.sourceDate !== date ? `，数据日 ${day.sourceDate}` : '';
        return `<span class="auction-pct ${cls}" title="9:25竞价涨幅${sourceDate}">竞${sign}${value.toFixed(2)}%</span>`;
      }
      function isBidSealStock(date, code) {
        const codes = BID_CODES_BY_DATE.get(date);
        return Boolean(codes && codes.has(String(code || '').trim()));
      }
      function isThreeBoardPoolStock(code) {
        return THREE_BOARD_POOL_CODES.has(String(code || '').trim());
      }
      function dateColumnWidths(dates) {
        const byDate = new Map(state.records.map(record => [record.date, record]));
        return dates.map(date => {
          const record = byDate.get(date);
          let groups = 1;
          if (record) {
            for (const [board, lines] of record.sections) {
              if (board >= 2) groups = Math.max(groups, Math.ceil(stockCount(lines) / 30));
            }
          }
          // 二板及以上按每组 3 列、每列最多 10 行排列；首板保持普通列宽并纵向展开。
          // 股票按钮现在还显示 9:25 竞价涨幅，给每列预留足够宽度避免被单元格裁切。
          // 190px 可容纳较长名称、6位代码和最高至 +30.00% 的竞价涨幅。
          return Math.max(CELL_WIDTH, groups * 3 * 190 + 28);
        });
      }
      function setGridColumns(dates) {
        const widths = dateColumnWidths(dates);
        const template = `${LABEL_WIDTH}px ${widths.map(width => `${width}px`).join(' ')}`;
        els.header.style.gridTemplateColumns = template;
        els.body.style.setProperty('--date-count', dates.length);
        els.body.style.setProperty('--date-template', template);
        els.matrix.style.width = `${LABEL_WIDTH + widths.reduce((sum, width) => sum + width, 0)}px`;
      }
      function renderHeader(dates) {
        els.header.innerHTML = '<div class="corner">连板层级 / 日期（近 → 远）</div>' + dates.map((date, index) => `<div class="date-head"><strong>${dateLabel(date)}</strong><small>${index === 0 ? '最近' : `周${weekday(date)}`}</small></div>`).join('');
      }
      function renderLine(line, compact, date) {
        const pattern = /([^，,、；;\s]+?)（[^）]*）(\d{6})/g;
        let html = '', cursor = 0, found = false;
        for (const match of line.matchAll(pattern)) {
          found = true;
          const separator = line.slice(cursor, match.index);
          html += escapeHtml(compact ? separator.replace(/[，,、；;]/g, '') : separator);
          const text = `${match[1]} ${match[2]}`.toLowerCase();
          const hit = state.query && text.includes(state.query);
          const selected = state.selectedCode === match[2];
          const bidSeal = isBidSealStock(date, match[2]);
          const poolStock = isThreeBoardPoolStock(match[2]);
          const notes = [poolStock ? '三板组股票池' : '', bidSeal ? '09:25 竞价一字板' : ''].filter(Boolean).join(' · ');
          html += `<span class="stock-chip${bidSeal ? ' bid-seal' : ''}${poolStock ? ' three-board-pool' : ''}${hit ? ' match' : ''}${selected ? ' selected' : ''}" data-code="${escapeAttr(match[2])}" data-name="${escapeAttr(match[1])}"${notes ? ` title="${notes}"` : ''}>${escapeHtml(match[1])}<em>${escapeHtml(match[2])}</em>${auctionPctMarkup(date, match[2])}</span>`;
          cursor = match.index + match[0].length;
        }
        html += escapeHtml(compact ? line.slice(cursor).replace(/[，,、；;]/g, '') : line.slice(cursor));
        return found ? `<div class="content-line">${html}</div>` : `<div class="theme-line">${escapeHtml(line)}</div>`;
      }
      function renderLimitedContent(lines, date) {
        const themes = [];
        const stocks = [];
        for (const line of lines) {
          const matches = [...line.matchAll(/([^，,、；;\s]+?)（[^）]*）(\d{6})/g)];
          if (!matches.length) {
            themes.push(`<div class="theme-line">${escapeHtml(line)}</div>`);
            continue;
          }
          matches.forEach(match => stocks.push({ name: match[1], code: match[2] }));
        }
        const groups = [];
        for (let i = 0; i < stocks.length; i += 30) {
          const group = stocks.slice(i, i + 30).map(stock => {
            const hit = state.query && `${stock.name} ${stock.code}`.toLowerCase().includes(state.query);
            const selected = state.selectedCode === stock.code;
            const bidSeal = isBidSealStock(date, stock.code);
            const poolStock = isThreeBoardPoolStock(stock.code);
            const notes = [poolStock ? '三板组股票池' : '', bidSeal ? '09:25 竞价一字板' : ''].filter(Boolean).join(' · ');
            return `<span class="stock-chip${bidSeal ? ' bid-seal' : ''}${poolStock ? ' three-board-pool' : ''}${hit ? ' match' : ''}${selected ? ' selected' : ''}" data-code="${escapeAttr(stock.code)}" data-name="${escapeAttr(stock.name)}"${notes ? ` title="${notes}"` : ''}>${escapeHtml(stock.name)}<em>${escapeHtml(stock.code)}</em>${auctionPctMarkup(date, stock.code)}</span>`;
          }).join('');
          groups.push(`<div class="stock-group">${group}</div>`);
        }
        return `${themes.join('')}<div class="stock-grid">${groups.join('')}</div>`;
      }
      function renderCell(record, board, date) {
        const lines = record && record.sections.get(board);
        if (!lines || !lines.length) return '<div class="board-cell"><div class="cell-empty">—</div></div>';
        const text = lines.join(' ').toLowerCase();
        const hasMatch = state.query && text.includes(state.query);
        const dim = state.query && !hasMatch;
        const selected = state.selectedCode && lines.some(line => line.includes(state.selectedCode));
        const content = board === 1 ? lines.map(line => renderLine(line, true, date)).join('') : renderLimitedContent(lines, date);
        return `<div class="board-cell has-content${hasMatch ? ' cell-match' : ''}${dim ? ' cell-dim' : ''}${selected ? ' selected-cell' : ''}" data-date="${date}" data-board="${board}" data-text="${escapeAttr(text)}">${content}</div>`;
      }
      function renderRows(dates) {
        const byDate = new Map(state.records.map(record => [record.date, record]));
        const rows = [];
        for (let board = state.maxBoard; board >= 1; board--) {
          const high = board >= 3 ? ' high' : '';
          rows.push(`<div class="board-row"><div class="board-label${high}">${board === 1 ? '首板' : `${board}板`}</div>${dates.map(date => renderCell(byDate.get(date), board, date)).join('')}</div>`);
        }
        els.body.innerHTML = rows.join('') || '<div class="no-data">暂无涨停数据</div>';
        els.body.querySelectorAll('.stock-chip').forEach(chip => {
          chip.addEventListener('click', event => { event.stopPropagation(); selectStock(chip.dataset.code); });
          chip.addEventListener('dblclick', event => { event.preventDefault(); event.stopPropagation(); showHistory(chip.dataset.code, chip.dataset.name); });
        });
      }
      function render() {
        const dates = activeDates();
        setGridColumns(dates);
        renderHeader(dates);
        renderRows(dates);
        const matchCount = state.query ? [...state.stockHistory.values()].filter(stock => `${stock.name} ${stock.code}`.toLowerCase().includes(state.query)).length : 0;
        const selectedName = state.selectedCode ? (state.stockHistory.get(state.selectedCode)?.name || state.selectedCode) : '';
        els.status.textContent = `${state.records.length} 个交易日 · 已加载 ${dates.length} 天 · 最高 ${state.maxBoard} 板${state.query ? ` · 匹配 ${matchCount} 只` : ''}${selectedName ? ` · 已选 ${selectedName}` : ''}`;
        els.hint.textContent = state.visibleCount < state.dates.length ? `单击高亮，双击打开详情；横向滚动到最右侧会自动加载更早日期（已加载 ${state.visibleCount}/${state.dates.length} 天）。` : `单击高亮，双击打开详情；已加载全部 ${state.dates.length} 个交易日。`;
      }
      function appendOlder() {
        if (state.visibleCount >= state.dates.length) return;
        const left = els.viewport.scrollLeft;
        state.visibleCount = Math.min(state.visibleCount + BATCH_SIZE, state.dates.length);
        render();
        els.viewport.scrollLeft = left;
      }
      function selectStock(code) {
        state.selectedCode = code;
        render();
      }
      function findStockDetail(code, name) {
        if (typeof SD === 'undefined' || !SD) return null;
        if (name && SD[name]) return { name, data: SD[name] };
        for (const [key, value] of Object.entries(SD)) {
          if (value && String(value.c || '') === String(code)) return { name: key, data: value };
        }
        return null;
      }
      function formatMarketCap(value) {
        const number = Number(value);
        if (!Number.isFinite(number) || number <= 0) return '';
        const trim = text => text.replace(/\.?(0+)$/, '').replace(/\.$/, '');
        if (number >= 1e12) return `${trim((number / 1e12).toFixed(2))}万亿`;
        if (number >= 1e8) return `${trim((number / 1e8).toFixed(number >= 1e10 ? 1 : 2))}亿`;
        if (number >= 1e4) return `${trim((number / 1e4).toFixed(1))}万`;
        return `${Math.round(number).toLocaleString('zh-CN')}元`;
      }
      function formatShares(value) {
        const number = Number(value);
        return Number.isFinite(number) && number > 0 ? `${number.toLocaleString('zh-CN', { maximumFractionDigits: 2 })}亿股` : '';
      }
      function renderStockDetail(name, code) {
        const found = findStockDetail(code, name);
        const d = found && found.data;
        if (!d) {
          els.detailSummary.innerHTML = '<div class="empty-detail">暂无股票详情数据</div>';
          els.detailConcepts.innerHTML = '<div class="empty-detail">暂无题材概念数据</div>';
          els.detailShareholders.innerHTML = '<div class="empty-detail">暂无股东和股本数据</div>';
          return;
        }
        const region = d.r || '暂无';
        const marketDate = typeof SD_META !== 'undefined' && SD_META.marketCapDate ? `（${SD_META.marketCapDate}）` : '';
        const summary = [
          ['地域 / 行业', region],
          ['总市值', formatMarketCap(d.mv) ? `${formatMarketCap(d.mv)}${marketDate}` : '暂无'],
          ['总股本', formatShares(d.h && d.h.ts) || '暂无'],
          ['流通股本', formatShares(d.h && d.h.cs) || '暂无']
        ];
        els.detailSummary.innerHTML = summary.map(item => `<div class="summary-item"><small>${escapeHtml(item[0])}</small><strong>${escapeHtml(item[1])}</strong></div>`).join('');
        const tags = String(d.t || '').split(',').map(item => item.trim()).filter(Boolean);
        const explanations = Array.isArray(d.e) ? d.e : [];
        const tagHtml = tags.length ? `<div class="concept-pills">${tags.map(tag => `<span class="concept-pill">${escapeHtml(tag)}</span>`).join('')}</div>` : '<div class="empty-detail">暂无概念标签</div>';
        const explanationHtml = explanations.map(item => `<div class="concept-explanation"><strong>${escapeHtml(item[0] || '')}</strong><div>${escapeHtml(item[1] || '')}</div></div>`).join('');
        els.detailConcepts.innerHTML = tagHtml + explanationHtml;
        const h = d.h || {};
        const shareCards = [
          ['控股股东', h.c || '暂无'],
          ['第一大股东持股', h.t ? `${h.t}%` : '暂无'],
          ['前十大合计持股', h.tt ? `${h.tt}%` : '暂无'],
          ['流通股占比', h.rt ? `${h.rt}%` : '暂无']
        ];
        let shareholders = `<div class="share-grid">${shareCards.map(item => `<div class="summary-item"><small>${escapeHtml(item[0])}</small><strong>${escapeHtml(String(item[1]))}</strong></div>`).join('')}</div>`;
        const top10 = Array.isArray(h.top10) ? h.top10 : [];
        const floatTop10 = Array.isArray(h.floatTop10) ? h.floatTop10 : [];
        const ratioTotal = rows => rows.reduce((sum, holder) => {
          const value = Number(holder && holder.r);
          return Number.isFinite(value) ? sum + value : sum;
        }, 0);
        const holderColumn = (title, rows, total, period) => {
          const list = rows.length ? `<div class="top10-list">${rows.map((holder, index) => `<div class="top10-item"><span class="top10-name">${index + 1}. ${escapeHtml(holder.n || '')}</span><span class="top10-ratio">${holder.r || 0}%</span><span class="top10-change">${escapeHtml(holder.c || '')}</span></div>`).join('')}</div>` : '<div class="empty-detail">暂无数据</div>';
          return `<div class="shareholder-column"><h4>${title}<span class="shareholder-total">${rows.length ? `合计 ${total.toFixed(2)}%${period ? ` · ${escapeHtml(period)}` : ''}` : ''}</span></h4>${list}</div>`;
        };
        shareholders += `<div class="shareholder-columns">${holderColumn('十大股东', top10, ratioTotal(top10), '')}${holderColumn('十大流通股东', floatTop10, Number.isFinite(Number(h.floatTop10TotalRatio)) ? Number(h.floatTop10TotalRatio) : ratioTotal(floatTop10), h.floatTop10ReportPeriod || '')}</div>`;
        els.detailShareholders.innerHTML = shareholders;
      }
      function jumpToDate(value) {
        const query = String(value || '').trim();
        if (!query) return;
        const digits = query.replace(/\D/g, '');
        const index = state.dates.findIndex(date => {
          const normalized = date.replace(/\D/g, '');
          return date === query || normalized === digits || (digits.length >= 4 && normalized.endsWith(digits));
        });
        if (index < 0) {
          els.hint.textContent = `没有找到日期“${query}”，可输入完整日期，例如 2026-08-07。`;
          return;
        }
        state.visibleCount = Math.min(Math.max(state.visibleCount, Math.ceil((index + 1) / BATCH_SIZE) * BATCH_SIZE), state.dates.length);
        render();
        const widths = dateColumnWidths(activeDates());
        els.viewport.scrollLeft = Math.max(0, LABEL_WIDTH + widths.slice(0, index).reduce((sum, width) => sum + width, 0) - 20);
        els.hint.textContent = `已定位到 ${state.dates[index]}；横向滚动可继续查看相邻日期。`;
      }
      function showHistory(code, name) {
        const stock = state.stockHistory.get(code); if (!stock) return;
        const titleName = stock.name || name || code;
        els.modalTitle.textContent = titleName;
        els.modalCode.textContent = code;
        state.selectedCode = code;
        render();
        renderStockDetail(titleName, code);
        els.history.innerHTML = stock.days.map((item, index) => `<div class="history-item ${index === 0 ? 'recent' : ''}"><time>${item.date}</time><strong>${item.board}板</strong></div>`).join('');
        els.modal.classList.add('open');
      }
      els.viewport.addEventListener('scroll', () => { if (els.viewport.scrollLeft + els.viewport.clientWidth > els.viewport.scrollWidth - 650) appendOlder(); });
      els.viewport.addEventListener('wheel', event => { if (event.shiftKey && Math.abs(event.deltaY) > Math.abs(event.deltaX)) { event.preventDefault(); els.viewport.scrollLeft += event.deltaY; } }, { passive: false });
      els.search.addEventListener('input', () => { state.query = els.search.value.trim().toLowerCase(); render(); });
      els.dateSearchBtn.addEventListener('click', () => jumpToDate(els.dateSearch.value));
      els.dateSearch.addEventListener('keydown', event => { if (event.key === 'Enter') jumpToDate(els.dateSearch.value); });
      els.initialDays.addEventListener('change', loadData);
      els.todayBtn.addEventListener('click', () => { els.viewport.scrollLeft = 0; });
      els.clearSelection.addEventListener('click', () => { state.selectedCode = ''; render(); });
      els.reloadBtn.addEventListener('click', loadData);
      els.modalClose.addEventListener('click', () => els.modal.classList.remove('open'));
      els.modal.addEventListener('click', event => { if (event.target === els.modal) els.modal.classList.remove('open'); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') els.modal.classList.remove('open'); });
      loadData();
    })();
  </script>
</body>
</html>
