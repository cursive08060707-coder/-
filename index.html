<script>
console.log('✅ 涨停板归类 v2026-05-28-gz loaded | searchRegion=no show() | init=show(0)');

// === 主显示逻辑 ===
let ai=-1,st='',sr=new Set(),fd=[],hi=-1;
const _SN = new Set(Object.keys(SN));  // 从stock_names.js?v=20260711-0936初始化
const dl=document.getElementById('dl'),ct=document.getElementById('ct'),si=document.getElementById('si'),stEl=document.getElementById('st'),ri=document.getElementById('ri'),rb=document.getElementById('rb');
const wk=['日','一','二','三','四','五','六'];
stEl.textContent=P.length+'天';

function render(){
  dl.innerHTML='';
  const a=st?fd:P.map((_,i)=>i);
  a.forEach(i=>{
    const e=document.createElement('div');
    e.className='di'+(i===ai?' on':'');
    let t=P[i].d.slice(5)+' 周'+wk[new Date(P[i].d).getDay()];
    if(st&&sr.has(i))t+='<span class="m">✓</span>';
    e.innerHTML=t;
    e.onclick=()=>show(i);
    dl.appendChild(e);
  });
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// 题材名覆盖：这些词在首板中应作为题材名，即使也是股票名
const _TN=new Set(["机器人"]);

function isSN(s){
  try{
    // 全角/半角字母转换
    let s_conv='';
    for(let c of s){
      if(c>='A'&&c<='Z')s_conv+=String.fromCharCode(c.charCodeAt(0)+0xFF21-0x41);
      else if(c>='a'&&c<='z')s_conv+=String.fromCharCode(c.charCodeAt(0)+0xFF41-0x61);
      else s_conv+=c;
    }
    // 先检查转换后的名称（全角）
    if(_SN.has(s_conv)&&!_TN.has(s_conv))return true;
    // 再检查原始名称
    if(_SN.has(s)&&!_TN.has(s))return true;
    return false;
  }catch(e){return false}
}
function isRealSN(s){
  try{
    // 全角/半角字母转换
    let s_conv='';
    for(let c of s){
      if(c>='A'&&c<='Z')s_conv+=String.fromCharCode(c.charCodeAt(0)+0xFF21-0x41);
      else if(c>='a'&&c<='z')s_conv+=String.fromCharCode(c.charCodeAt(0)+0xFF41-0x61);
      else s_conv+=c;
    }
    if(_SN.has(s_conv))return true;
    if(_SN.has(s))return true;
    return false;
  }catch(e){return false}
}

function show(i){
  ai=i;const p=P[i];const lines=p.t.split('\n');
  let h='<div class="bh">'+p.d+' 周'+wk[new Date(p.d).getDay()]+'<a href="'+p.l+'" target="_blank">原文→</a></div>';
  let cb='',cs='',sb=[],bo=false;
  function fs(){
    if(!sb.length)return;
    if(cb==='首板'&&cs){
      h+='<div class="sl"><div class="sh">'+esc(cs)+'</div><div class="stk">';
      sb.forEach(s=>{h+='<span class="sk" data-n="'+esc(s.name)+'">'+esc(s.disp)+'</span>'});
      h+='</div></div>';
    }else if(cb){
      h+='<div class="mbl"><div class="mbs">';
      sb.forEach(s=>{h+='<span class="mb" data-n="'+esc(s.name)+'">'+esc(s.disp)+'</span>'});
      h+='</div></div>';
    }
    sb=[];
  }
  function cl(){fs();if(bo){h+='</div>';bo=false;}}
  for(let line of lines){
    line=line.trim();if(!line){fs();continue;}
    if(/^(首板|二板|三板|四板|五板|六板|七板|八板|九板|十板)$/.test(line)){
      cl();cb=line;cs='';bo=true;h+='<div class="bl"><div class="blh">'+line+'</div>';continue;
    }
    if(cb==='首板'&&line.length<=12&&!line.includes('\uff0c')&&!line.includes(',')&&!isSN(line)){
      fs();cs=line;continue;
    }
    if(cb){
      if(cb==='首板'){
        let ps=line.split(/[,\uff0c]+/);
        for(let x of ps){x=x.trim();for(let s of['\uff1a',':','\u3001']){if(x.includes(s))x=x.split(s)[0].trim();}let px=x.includes('（')?x.split('（')[0].trim():x;if(px.length>=2&&isSN(px))sb.push({disp:x,name:px});}
      }else{
        // 连板格式处理
        // 格式1（zt_data.js?v=20260711-0936）："股票名（拼音）代码，股票名（拼音）代码..."（一行多股票）
        // 格式2（原文）："股票名、描述"（每行一个股票）
        let ps=[];
        // 先用顿号分隔（原文格式）
        if(line.includes('\u3001')){
          ps=line.split(/\u3001+/);
        }else{
          // 再用中文逗号分隔（zt_data.js?v=20260711-0936格式）
          ps=line.split(/[,\uff0c]+/);
        }
        for(let p of ps){
          p=p.trim();
          // 去掉括号内容（拼音和代码）
          let px=p.includes('（')?p.split('（')[0].trim():p;
          // 去掉描述部分（冒号/句号后）
          for(let s of['\uff1a',':','\u3002']){if(px.includes(s))px=px.split(s)[0].trim();}
          // 保存：disp 用于显示（含括号），name 用于查找 SD（纯股票名）
          if(px.length>=2&&isSN(px))sb.push({disp:p,name:px});
        }
      }
    }
  }
  cl();ct.innerHTML=h;
  // 搜索高亮
  if(st){
    let cnt=0;const lo=st.toLowerCase();
    ct.querySelectorAll('.sk,.mb,.sh').forEach(el=>{
      const t=el.textContent;const p=t.toLowerCase().indexOf(lo);
      if(p>=0){el.innerHTML=esc(t.substring(0,p))+'<span class="hl">'+esc(t.substring(p,p+st.length))+'</span>'+esc(t.substring(p+st.length));cnt++;}
    });
    stEl.textContent='匹配 '+cnt+' 处';
    if(cnt>0){hi=0;const hl=document.querySelectorAll('#ct .hl');hl.forEach((x,j)=>{x.style.background=j===0?'#ffd700':'#fff176';});setTimeout(()=>{if(hl[0])hl[0].scrollIntoView({block:'center',behavior:'smooth'});},120);}
  }
  render();
  const vi=st?fd.indexOf(i):i;const items=dl.querySelectorAll('.di');
  if(items[vi])items[vi].scrollIntoView({block:'nearest'});
}

function search(){
  st=si.value.trim();sr.clear();fd=[];hi=-1;rst='';if(ri)ri.value='';rb.textContent='';document.querySelectorAll('.hl2').forEach(el=>el.classList.remove('hl2'));
  if(!st){render();if(ai>=0)show(ai);return;}
  const lo=st.toLowerCase();
  P.forEach((p,i)=>{if(p.t.toLowerCase().includes(lo)){sr.add(i);fd.push(i);}});
  render();fd.length?show(fd[0]):(ct.innerHTML='<div id="wt">无结果</div>',stEl.textContent='0 结果');
}

function scrollHl(d){
  const h=document.querySelectorAll('#ct .hl');if(!h.length)return;
  hi=((hi+d)%h.length+h.length)%h.length;
  h.forEach((x,j)=>{x.style.background=j===hi?'#ffd700':'#fff176';});
  h[hi].scrollIntoView({block:'center',behavior:'smooth'});
}

// === 地域/题材搜索 ===
let rst='';
function extractStocksFromT(t){
  const stocks=[];
  const m=t.matchAll(/([^\n，\uff0c、\s]{2,10})（[^）]*）/g);
  for(const match of m){stocks.push(match[1].trim());}
  return stocks;
}
function searchRegion(){
  rst=ri.value.trim();
  document.querySelectorAll('.hl2').forEach(el=>el.classList.remove('hl2'));
  if(!rst){rb.textContent='';return;}
  const sd=window.SD||SD||{};
  let matches=[];
  // 只搜当前选中日期
  if(ai<0){rb.textContent='请先选择日期';return;}
  const p=P[ai];
  const stocks=extractStocksFromT(p.t);
  for(const s of stocks){
    if(!sd[s])continue;
    let found=false;
    if(sd[s].r&&sd[s].r.includes(rst))found=true;
    if(sd[s].e&&Array.isArray(sd[s].e)){for(const item of sd[s].e){const cn=Array.isArray(item)?item[0]:item;if(typeof cn==='string'&&cn.includes(rst)){found=true;break;}}}
    if(found&&!matches.includes(s))matches.push(s);
  }
  let cnt=0;
  document.querySelectorAll('.sk,.mb').forEach(el=>{
    const n=el.getAttribute('data-n');
    if(matches.includes(n)){el.classList.add('hl2');cnt++;}
  });
  rb.textContent=matches.length?`找到 ${cnt} 只`:'无结果';
}
let rt;ri.addEventListener('input',()=>{clearTimeout(rt);rt=setTimeout(searchRegion,150);});

let t;si.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(search,150);});
document.addEventListener('keydown',e=>{
  if(e.target===si||e.target===ri){if(e.key==='Escape'){si.value='';search();if(ri){ri.value='';searchRegion();}si.blur();}else if(e.key==='.'||e.key==='>'){e.preventDefault();ri.focus();}else if(e.key==='Enter'){e.preventDefault();scrollHl(1);}return;}
  const a=st?fd:P.map((_,i)=>i),cv=st?fd.indexOf(ai):ai;
  if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();if(cv>0)show(a[cv-1]);}
  else if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();if(cv<a.length-1)show(a[cv+1]);}
  else if(e.key==='/'){e.preventDefault();si.focus();}
  else if(e.key==='n'||e.key==='Enter'){scrollHl(1);}
  else if(e.key==='N'||e.key==='p'){scrollHl(-1);}
});
render();show(0);
</script>
<script>
// === 股票弹窗逻辑 ===
let spCode='',spName='';
function showSp(name,e){
  if(typeof SD==='undefined')return;
  // 全角/半角转换（zt_data.js?v=20260711-0936 可能是半角，SD 键是全角）
  let name_conv='';
  for(let c of name){
    if(c>='A'&&c<='Z')name_conv+=String.fromCharCode(c.charCodeAt(0)+0xFF21-0x41);
    else if(c>='a'&&c<='z')name_conv+=String.fromCharCode(c.charCodeAt(0)+0xFF41-0x61);
    else name_conv+=c;
  }
  // 先查转换后的名（全角），再查原名
  const d=SD[name_conv]||SD[name];if(!d)return;
  e.stopPropagation();
  spCode=d.c||'';spName=name;
  document.getElementById('sp-n').textContent=name+'（'+d.c+'）';
  const rg=document.getElementById('sp-rg');
  if(d.r){const parts=d.r.split(' / ');rg.innerHTML='<b>'+esc(parts[0]||'')+'</b>'+esc(parts[1]?' / '+parts[1]:'');rg.style.display='block';}else{rg.style.display='none';}
  const tc=document.getElementById('sp-t');tc.innerHTML='';
  if(d.t){d.t.split(',').forEach(t=>{t=t.trim();if(t){const s=document.createElement('span');s.textContent=t;s.onclick=()=>{document.getElementById('si').value=t;search();closeSp();};tc.appendChild(s);}});}
  document.getElementById('sp-hc').innerHTML='';
  document.getElementById('sp-ht').innerHTML='';
  const ec=document.getElementById('sp-e');ec.innerHTML='';
  if(d.e&&d.e.length){d.e.forEach(x=>{const div=document.createElement('div');div.innerHTML='<b>'+esc(x[0])+'：</b>'+esc(x[1]);ec.appendChild(div);});}
  // 买一量曲线图
  const chartEl=document.getElementById('sp-chart');
  if(ai>=0&&d.c&&typeof HD!=='undefined'){
    const date=P[ai].d;
    const key=date+'_'+d.c;
    const fname=HD[key];
    if(fname){
      const imgPath=encodeURI('恒单/'+date+'/'+fname);
      var img=document.createElement('img');img.src=imgPath;img.loading='lazy';
      img.onerror=function(){chartEl.innerHTML='<h4>📈 买一量曲线</h4><div class="sp-nochart">图片加载失败</div>';};
      chartEl.innerHTML='<h4>📈 买一量曲线</h4>';chartEl.appendChild(img);
    }else{
      chartEl.innerHTML='<h4>📈 买一量曲线</h4><div class="sp-nochart">该日期无曲线数据</div>';
    }
  }else{
    chartEl.innerHTML='';
  }
  // 编辑切换链接
  const spBody=document.querySelector('#sp .sp-b');
  if(spBody){
    let editLink=spBody.querySelector('.sp-edit-toggle');
    if(!editLink){editLink=document.createElement('div');editLink.className='sp-edit-toggle';editLink.textContent='✏️ 编辑概念';editLink.onclick=function(){spEditStart(name);};spBody.appendChild(editLink);}
  }
  
  document.getElementById('sp').classList.add('show');
  const r=e.target.getBoundingClientRect();let top=r.bottom+6,left=r.left;
  if(top+500>innerHeight)top=r.top-500;if(top<10)top=10;if(left+380>innerWidth)left=innerWidth-390;if(left<10)left=10;
  document.getElementById('sp').style.top=top+'px';document.getElementById('sp').style.left=left+'px';
  fetchHolder(d.c);
}

// === K线弹窗 ===
function loadTVLib(cb){
  if(window.TradingView){cb();return;}
  const s=document.createElement('script');
  s.src='https://s3.tradingview.com/tv.js';s.onload=cb;
  document.head.appendChild(s);
}
function openKline(){
  if(!spCode)return;
  closeSp();
  const m=spCode.startsWith('6')||spCode.startsWith('68')?'sh':'sz';
  const date=(ai>=0&&P[ai])?P[ai].d:'';
  const sym=(spCode.startsWith('6')||spCode.startsWith('68')?'SSE:':'SZSE:')+spCode;
  document.getElementById('sp-k-n').textContent=spName+'（'+spCode+'）'+(date?' · '+date:'');
  const body=document.getElementById('sp-k-body');
  let minImgSrc='';
  if(date&&typeof FM!=='undefined'){const fk=date+'_'+spCode;if(FM[fk])minImgSrc=encodeURI(FM[fk]);}
  if(!minImgSrc)minImgSrc='https://image.sinajs.cn/newchart/min/n/'+m+spCode+'.gif';
  let html='<div class="chart-label"><b>当日分时</b><a href="https://quote.eastmoney.com/'+m+spCode+'.html" target="_blank">东财→</a></div>';
  html+='<div class="chart-min-wrap"><img src="'+minImgSrc+'" onerror="this.parentElement.outerHTML=\'<div style=color:#ccc;font-size:11px;padding:16px;border:1px solid #f0f0f0;border-radius:4px>分时图加载失败</div>\'"></div>';
  html+='<div class="chart-label"><b>日K</b></div>';
  html+='<div class="tv-wrap" id="tv-kbox"></div>';
  body.innerHTML=html;
  // 居中显示
  const spk=document.getElementById('sp-k');
  spk.classList.add('show');
  spk.style.left=Math.max(20,(innerWidth-1000)/2)+'px';
  spk.style.top='20px';
  // 加载TV
  loadTVLib(()=>{
    const box=document.getElementById('tv-kbox');
    if(!box)return;
    const w=document.createElement('div');w.id='tv-kchart';w.style.height='100%';w.style.width='100%';
    box.appendChild(w);
    try{new TradingView.widget({container_id:'tv-kchart',autosize:true,symbol:sym,interval:'D',timezone:'Asia/Shanghai',theme:'light',style:'1',locale:'zh_CN',allow_symbol_change:false,hide_side_toolbar:false,studies:[]});}catch(er){}
  });
}
function closeKline(){
  document.getElementById('sp-k').classList.remove('show');
  document.getElementById('sp-k-body').innerHTML='';
}
// K线弹窗拖拽
(function(){
  const spk=document.getElementById('sp-k');
  let dragging=false,ox,oy;
  spk.querySelector('.sp-h').addEventListener('mousedown',function(e){
    if(e.target.closest('.sp-x'))return;
    dragging=true;ox=e.clientX-spk.offsetLeft;oy=e.clientY-spk.offsetTop;
    e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    let x=e.clientX-ox,y=e.clientY-oy;
    x=Math.max(0,Math.min(x,innerWidth-spk.offsetWidth));
    y=Math.max(0,Math.min(y,innerHeight-spk.offsetHeight));
    spk.style.left=x+'px';spk.style.top=y+'px';
  });
  document.addEventListener('mouseup',function(){dragging=false;});
})();

function fetchHolder(code){
  if(!code)return;
  let stockData=null;
  for(let k in SD){if(SD[k].c===code){stockData=SD[k];break;}}
  const hc=document.getElementById('sp-hc');const ht=document.getElementById('sp-ht');
  if(!stockData||!stockData.h){hc.innerHTML='<div class="sp-loading">暂无数据</div>';ht.innerHTML='';return;}
  const h=stockData.h;
  if(h.c){hc.innerHTML='<h4>实际控制人</h4><div class="hd-r"><b>'+esc(h.c)+'</b></div>';}else{hc.innerHTML='';}
  if(h.f!==undefined){
    var ff=100-h.f;
    var txt='<h4>实际流通</h4><div class="hd-r">>5%股东合计 <b>'+h.f+'%</b></div><div class="hd-r">实际流通 <b>'+ff+'%</b></div>';
    if(h.tt!==undefined){var ffMv=Math.round(h.tt*ff/100*100)/100;txt+='<div class="hd-r">总市值 <b>'+h.tt+'亿</b></div><div class="hd-r">实际流通市值 <b style="color:#d4380d">'+ffMv+'亿</b></div>';}
    ht.innerHTML=txt;
  }else if(h.t){ht.innerHTML='<h4>十大股东</h4><div class="hd-r"><b>'+h.t+'%</b></div>';}
  else{ht.innerHTML='';}
}

let spEditName=null;
function spEditStart(name){
  spEditName=name;
  if(typeof SD==='undefined')return;
  const d=SD[name];if(!d)return;
  document.getElementById('sp-edit-themes').value=d.t||'';
  let ex='';if(d.e&&d.e.length){d.e.forEach(x=>{ex+=x[0]+'|'+x[1]+'\n';});}
  document.getElementById('sp-edit-explain').value=ex;
  document.getElementById('sp-edit-section').style.display='block';
  document.querySelector('.sp-edit-toggle').style.display='none';
}
function spEditCancel(){
  document.getElementById('sp-edit-section').style.display='none';
  const toggle=document.querySelector('.sp-edit-toggle');if(toggle)toggle.style.display='block';
}
function spEditSave(){
  if(!spEditName||typeof SD==='undefined')return;
  const d=SD[spEditName];if(!d)return;
  const themes=document.getElementById('sp-edit-themes').value.trim();
  const explain=document.getElementById('sp-edit-explain').value;
  const eData=[];
  explain.split('\n').filter(Boolean).forEach(line=>{const idx=line.indexOf('|');if(idx>0)eData.push([line.substring(0,idx).trim(),line.substring(idx+1).trim()]);});
  d.t=themes;d.e=eData;
  
  // 1. 写 localStorage（立即生效）
  try{localStorage.setItem('sd_'+spEditName,JSON.stringify(d));}catch(e){}
  
  // 2. POST 到服务器写入文件（如果服务器运行）
  fetch('http://127.0.0.1:9999/api/save-concept', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: spEditName, themes: themes, explain: eData})
  }).then(r => r.json()).then(res => {
    if(res.success){
      // 更新数据并关闭编辑区域
      spEditCancel();
      alert('已保存 ✅');
    }else{
      if(res.error){alert('保存失败：'+res.error);}else{alert('服务器响应异常');}
    }
  }).catch(e => {
    console.error('Fetch error:', e); alert('请求失败: ' + e.message + '\
已存本地');
  });
}

function closeSp(){spEditName=null;document.getElementById('sp-edit-section').style.display='none';document.getElementById('sp').classList.remove('show');}
document.addEventListener('click',e=>{if(!e.target.closest('#sp')&&!e.target.closest('#sp-k')&&!e.target.closest('.sk')&&!e.target.closest('.mb')){closeSp();closeKline();}});
document.getElementById('sp-k').addEventListener('click',function(e){if(!e.target.closest('.tv-wrap')&&!e.target.closest('.sp-h'))closeKline();});
document.getElementById('ct').addEventListener('click',function(e){const sk=e.target.closest('.sk,.mb');if(sk&&sk.dataset.n){closeKline();showSp(sk.dataset.n,e);}});

// === 编辑器逻辑 ===
let edStock=null;
function openEd(){document.getElementById('ed').classList.add('show');document.getElementById('ed-name').focus();}
function closeEd(){document.getElementById('ed').classList.remove('show');edStock=null;}
function findStock(name){if(typeof SD==='undefined')return null;if(SD[name])return{name:name,data:SD[name]};for(let k in SD){if(k.includes(name)||name.includes(k))return{name:k,data:SD[k]};}return null;}

document.getElementById('ed-name').addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    e.preventDefault();const n=this.value.trim();if(!n)return;
    const f=findStock(n);
    if(f){
      edStock=f;
      document.getElementById('ed-code').value=f.data.c||'';
      document.getElementById('ed-region').value=f.data.r||'';
      document.getElementById('ed-themes').value=(f.data.t||'');
      renderEdTags();
      let ex='';if(f.data.e&&f.data.e.length){f.data.e.forEach(x=>{ex+=x[0]+'|'+x[1]+'\n';});}
      document.getElementById('ed-explain').value=ex;
    }else{alert('未找到: '+n);}
  }
});

function renderEdTags(){
  if(!edStock)return;const tc=document.getElementById('ed-tags');tc.innerHTML='';
  const themes=document.getElementById('ed-themes').value.split(',').map(t=>t.trim()).filter(Boolean);
  themes.forEach(t=>{const s=document.createElement('span');s.textContent=t;s.className='rm';s.onclick=()=>{document.getElementById('ed-themes').value=document.getElementById('ed-themes').value.split(',').map(x=>x.trim()).filter(x=>x&&x!==t).join(',');renderEdTags();};tc.appendChild(s);});
}
document.getElementById('ed-themes').addEventListener('input',renderEdTags);

function saveEd(){
  if(!edStock)return;
  const themes=document.getElementById('ed-themes').value;
  const explain=document.getElementById('ed-explain').value;
  const eData=[];
  explain.split('\n').filter(Boolean).forEach(line=>{const idx=line.indexOf('|');if(idx>0)eData.push([line.substring(0,idx).trim(),line.substring(idx+1).trim()]);});
  edStock.data.t=themes;edStock.data.e=eData;
  try{localStorage.setItem('sd_'+edStock.name,JSON.stringify(edStock.data));}catch(e){}
  if(document.getElementById('sp-n').textContent.includes(edStock.name)){
    const tc2=document.getElementById('sp-t');tc2.innerHTML='';
    if(edStock.data.t){edStock.data.t.split(',').forEach(t=>{t=t.trim();if(t){const s=document.createElement('span');s.textContent=t;s.onclick=()=>{document.getElementById('si').value=t;search();closeSp();};tc2.appendChild(s);}});}
    const ec2=document.getElementById('sp-e');ec2.innerHTML='';
    if(edStock.data.e&&edStock.data.e.length){edStock.data.e.forEach(x=>{const div=document.createElement('div');div.innerHTML='<b>'+esc(x[0])+'：</b>'+esc(x[1]);ec2.appendChild(div);});}
  }
  alert('已临时保存。需永久生效点击「永久保存」。');closeEd();
}

function savePerm(){
  var content='const SD='+JSON.stringify(SD,null,2)+';\n';
  var blob=new Blob([content],{type:'application/javascript'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='stock_detail_map.js?v=20260711-0936';
  a.click();
  URL.revokeObjectURL(a.href);
  alert('已下载！覆盖：坚果云/taoguba-延边刺客/stock_detail_map.js?v=20260711-0936');
}

// localStorage 恢复
(function(){
  if(typeof SD==='undefined')return;
  for(let k in SD){
    try{const s=localStorage.getItem('sd_'+k);if(s){const d=JSON.parse(s);if(d.t)SD[k].t=d.t;if(d.e)SD[k].e=d.e;}}catch(e){}
  }
})();
