<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>涨停板拆解 - 延边刺客</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; }
.header { position: sticky; top: 0; z-index: 100; background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 16px; }
.header h1 { font-size: 18px; color: #58a6ff; margin-bottom: 8px; }
.header h1 span { color: #8b949e; font-size: 13px; font-weight: normal; }
.search-box { display: flex; gap: 8px; }
.search-box input { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-size: 14px; outline: none; }
.search-box input:focus { border-color: #58a6ff; }
.search-box button { padding: 8px 16px; border-radius: 6px; border: none; background: #238636; color: #fff; cursor: pointer; font-size: 14px; }
.search-box button:hover { background: #2ea043; }
.search-box button.reset { background: #30363d; }
.search-box button.reset:hover { background: #484f58; }
.stats { font-size: 12px; color: #8b949e; margin-top: 6px; }
.list { max-width: 800px; margin: 0 auto; padding: 8px; }
.item { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
.item-header { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; gap: 12px; user-select: none; }
.item-header:hover { background: #1c2128; }
.date-badge { background: #1f6feb; color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
.date-badge.weekend { background: #6e40c9; }
.preview { flex: 1; font-size: 13px; color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.arrow { color: #484f58; font-size: 12px; transition: transform .2s; flex-shrink: 0; }
.item.open .arrow { transform: rotate(90deg); }
.item-body { display: none; padding: 0 16px 16px; border-top: 1px solid #21262d; }
.item.open .item-body { display: block; }
.item-body .meta { padding: 12px 0 8px; display: flex; justify-content: space-between; align-items: center; }
.item-body .meta a { color: #58a6ff; font-size: 12px; text-decoration: none; }
.item-body .meta a:hover { text-decoration: underline; }
.item-body .meta .char-count { font-size: 11px; color: #484f58; }
.item-body .content { font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; color: #c9d1d9; }
.highlight { background: #e3b341; color: #0d1117; padding: 0 2px; border-radius: 2px; }
.back-top { position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: #238636; color: #fff; border: none; cursor: pointer; font-size: 18px; display: none; z-index: 99; }
.back-top.show { display: flex; align-items: center; justify-content: center; }
.loading { text-align: center; padding: 40px; color: #8b949e; }
.load-err { color: #f85149; }
@media(max-width:600px) {
  .item-header { padding: 10px 12px; }
  .date-badge { font-size: 11px; padding: 2px 8px; }
  .preview { font-size: 12px; }
  .item-body .content { font-size: 13px; }
}
</style>
</head>
<body>
<div class="header">
  <h1>📊 涨停板拆解 <span>by 延边刺客</span></h1>
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="搜索股票名、板块、关键词…">
    <button onclick="doSearch()">搜索</button>
    <button class="reset" onclick="doReset()">重置</button>
  </div>
  <div class="stats" id="stats">加载中…</div>
</div>
<div class="list" id="list"><div class="loading">⏳ 正在加载数据…</div></div>
<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>
let allPosts = [], filtered = [], searchMode = false;

async function loadData() {
  const url = '涨停板拆解-简版.html';
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    const m = text.match(/const\s+P\s*=\s*(\[[\s\S]*?\])\s*;?\s*<\/script>/i);
    if (!m) throw new Error('未找到 P 数组');
    const data = JSON.parse(m[1]);
    if (!Array.isArray(data) || data.length === 0) throw new Error('P 数组为空');
    allPosts = data.slice().sort((a, b) => b.date.localeCompare(a.date));
    filtered = allPosts;
    render();
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="loading load-err">❌ 加载失败: ' + e.message + '</div>';
    document.getElementById('stats').textContent = '加载失败';
  }
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function getPreview(t) { const s = t.replace(/\n/g,' ').substring(0,80); return s + (t.length>80?'…':''); }
function getWeekDay(d) { return new Date(d.replace(/-/g,'/')).getDay(); }

function render() {
  const list = document.getElementById('list');
  const posts = filtered;
  if (!posts.length) {
    list.innerHTML = '<div class="loading">没有匹配的结果</div>';
    document.getElementById('stats').textContent = '共 0 条';
    return;
  }
  document.getElementById('stats').textContent = searchMode
    ? `搜索到 ${posts.length} 条 / 共 ${allPosts.length} 条`
    : `共 ${allPosts.length} 条 | ${allPosts[allPosts.length-1]?.date} ~ ${allPosts[0]?.date}`;

  const parts = [];
  for (let i = 0; i < posts.length; i++) {
    const p = posts[i], wd = getWeekDay(p.date);
    parts.push(`<div class="item" id="item-${i}" onclick="toggle(${i})"><div class="item-header"><span class="date-badge${wd===0||wd===6?' weekend':''}">${p.date}</span><span class="preview">${esc(getPreview(p.text))}</span><span class="arrow">▶</span></div><div class="item-body"><div class="meta"><a href="${p.link}" target="_blank" onclick="event.stopPropagation()">🔗 原帖</a><span class="char-count">${p.text.length} 字</span></div><div class="content">${esc(p.text)}</div></div></div>`);
  }
  list.innerHTML = parts.join('');
}

function toggle(i) { const el=document.getElementById('item-'+i); if(el) el.classList.toggle('open'); }

function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { doReset(); return; }
  searchMode = true;
  const ql = q.toLowerCase();
  filtered = allPosts.filter(p => p.text.toLowerCase().includes(ql) || p.date.includes(q));
  render();
  if (filtered.length > 0 && filtered.length <= 200) {
    document.querySelectorAll('.item').forEach(item => {
      const pr = item.querySelector('.preview'), ct = item.querySelector('.content');
      if (pr) pr.innerHTML = hl(pr.textContent, q);
      if (ct) ct.innerHTML = hl(ct.textContent, q);
    });
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function hl(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return esc(text).replace(re,'<span class="highlight">$1</span>');
}

function doReset() {
  searchMode = false;
  document.getElementById('searchInput').value = '';
  filtered = allPosts;
  render();
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key==='Enter') doSearch();
  if (e.key==='Escape') doReset();
});
window.addEventListener('scroll', () => {
  document.getElementById('backTop').classList.toggle('show', window.scrollY>600);
});

loadData();
</script>
</body>
</html>
